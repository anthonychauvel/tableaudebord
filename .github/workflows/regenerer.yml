name: Régénérer les données de veille

# Après chaque run de l'aspirateur (lundi/jeudi) et du mercredi de vérification
# des grilles : régénère donnees.json à partir des 3 dépôts, et le commit ici.
# Lançable aussi manuellement depuis l'app GitHub sur iPhone.
#
# Minute décalée à :07, pas :00 -- même raison que côté aspirateur.yml : GitHub
# peut abandonner en silence un run programmé pile à l'heure ronde en cas de
# forte charge, sans email ni trace nulle part. Repéré le 27/07/2026.
on:
  schedule:
    - cron: "7 9 * * 1,3,4"   # lundi, mercredi, jeudi à 9h07 UTC — après les autres runs
  workflow_dispatch:

permissions:
  contents: write
  issues: write                 # pour le ticket « le droit cité a changé »

jobs:
  regenerer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer ce dépôt (veille)
        uses: actions/checkout@v4

      - name: Récupérer l'application
        uses: actions/checkout@v4
        with:
          repository: tonytonic/hs
          ref: Android-cloudfare-production
          path: _hs

      - name: Récupérer le fonds (droit)
        uses: actions/checkout@v4
        with:
          repository: anthonychauvel/droit
          path: _droit

      - name: Récupérer le guide
        uses: actions/checkout@v4
        with:
          repository: tonytonic/Guide
          path: _guide

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Construire donnees.json
        run: |
          cd scripts
          python3 construire-donnees.py \
            --hs ../_hs --droit ../_droit --guide ../_guide \
            --out ../donnees.json

      - name: Committer si les données ont changé
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          # ccn-regles.json et historique/ étaient générés à chaque run mais
          # JAMAIS committés -- c'est pourquoi les onglets « Règles CCN » et
          # « Historique » affichaient "indisponible" en prod : le fetch ne
          # trouvait rien sur le serveur. sw.js aussi (bump de cache), sinon
          # la coquille de l'app resterait sur l'ancienne version.
          #
          # MÊME PANNE, DEUXIÈME ENDROIT (corrigé le 20/09/2026).
          # empreintes-articles.json et empreintes-fichiers.json étaient dans
          # le même cas. Sauf qu'ici la conséquence ne se voyait NULLE PART :
          # le runner démarre à neuf à chaque fois, donc sans le fichier commité
          # chaque article et chaque fichier étaient traités comme vus pour la
          # première fois -- « empreinte enregistrée, pas d'alerte ». Les deux
          # scripts de détection de changement tournaient depuis le début sans
          # avoir jamais pu alerter une seule fois, et le tableau affichait un
          # 0 parfaitement rassurant.
          #
          # C'est la raison pour laquelle ces deux fichiers doivent être
          # committés : ils SONT la mémoire d'un run à l'autre.
          #
          # Un par un, et seulement s'il existe : « git add releves/ » sur un
          # dossier absent sort en erreur 128 et, bash tournant avec -e sous
          # Actions, ferait échouer toute l'étape avant le commit. Or releves/
          # n'apparaît que le jour où un article change.
          for cible in donnees.json sw.js ccn-regles.json historique/ \
                       empreintes-articles.json empreintes-fichiers.json \
                       releves/; do
            [ -e "$cible" ] && git add "$cible" || true
          done
          git diff --cached --quiet && echo "Aucun changement." || \
            git commit -m "Données de veille — $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git push

      # Le tableau de bord est muet : il écrit donnees.json et attend qu'on
      # l'ouvre. Tant qu'il produisait 178 alertes dont 118 fausses, on
      # l'ouvrait pour faire le tri ; maintenant qu'il est fiable, il est
      # silencieux presque tout le temps -- et c'est ça qui fait qu'on arrête
      # de l'ouvrir, juste avant le jour où il a quelque chose à dire.
      #
      # APRÈS le push, volontairement : le ticket renvoie vers des fichiers
      # qui doivent déjà être en ligne quand tu cliques dessus.
      - name: Le droit cité a-t-il changé ?
        id: droit
        run: python3 scripts/alerter-droit.py --donnees donnees.json --sortie /tmp/ticket.md

      # Un ticket NEUF à chaque détection, et jamais refermé automatiquement :
      # un changement de droit est un événement qui demande une relecture, pas
      # un état qui se répare tout seul. Tes tickets fermés deviennent la liste
      # de ce que tu as déjà traité.
      - name: Ouvrir le ticket
        if: steps.droit.outputs.alerte == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create droit-modifie \
            --description "Un article cité par l'écosystème a changé" \
            --color 0E8A16 2>/dev/null || true
          gh issue create \
            --title "${{ steps.droit.outputs.titre }}" \
            --body-file /tmp/ticket.md \
            --label droit-modifie
