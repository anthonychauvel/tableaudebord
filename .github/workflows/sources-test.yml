name: TEST sources officielles (sans commit)

# Lancement manuel. Lit le BOSS, les flux du Parlement et cherche le fichier
# DARES, en affichant tout ce qui est trouvé. Ne committe rien.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VEILLE_RELAIS: ${{ vars.VEILLE_RELAIS }}
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le fonds (droit) — juste ccn/ et scripts/
        uses: actions/checkout@v4
        with:
          repository: anthonychauvel/droit
          path: _droit
          sparse-checkout: |
            ccn
            scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 0. boss.gouv.fr répond-il ? (direct, 90 s)
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code} en %{time_total} s\n" --max-time 90 \
            -A "Mozilla/5.0" https://boss.gouv.fr/portail/accueil.html || echo "pas de réponse"
          [ -n "$VEILLE_RELAIS" ] && curl -sS -o /dev/null -w "Par le relais : HTTP %{http_code}\n" --max-time 90 \
            "${VEILLE_RELAIS}https%3A%2F%2Fboss.gouv.fr%2Fportail%2Faccueil.html" || true

      - name: 1. BOSS, Parlement, DARES (diagnostic, mémoire temporaire)
        run: |
          cd scripts
          python3 veille-sources-officielles.py --droit ../_droit \
            --mots-cles ../mots-cles.json --memoire /tmp/memoire.json \
            --json /tmp/r.json --diagnostic

      - name: 2. Alertes produites
        run: |
          python3 -c "
          import json; r=json.load(open('/tmp/r.json'))
          for a in r['alertes']: print(a['gravite'], '|', a['titre'])
          print(len(r['alertes']), 'alerte(s)')"

      - name: 3. Recherche du fichier DARES le plus récent
        run: |
          pip install --quiet openpyxl
          mkdir -p /tmp/ccn && cp _droit/ccn/*.xlsx /tmp/ccn/ 2>/dev/null || true
          python3 _droit/scripts/maj_dares.py --ccn /tmp/ccn
          ls -la /tmp/ccn

      - name: 4. Barèmes hors droit du travail (OpenFisca, 3 versions en arrière)
        run: |
          cd scripts
          python3 - <<'PY'
          import importlib.util, json
          spec = importlib.util.spec_from_file_location("v", "veille-sources-officielles.py")
          v = importlib.util.module_from_spec(spec); spec.loader.exec_module(v)
          info = v._http_json(v.PYPI)
          vs = sorted(info["releases"], key=lambda x: [int(p) if p.isdigit() else 0 for p in x.split(".")])
          mem = {"openfisca": {"version": vs[-4]}}; al = []; sa = []
          v.veille_openfisca(mem, al, sa, "", "2026-10-02", True)
          for a in al:
              print(a["gravite"], "|", a["titre"]); print(a["detail"][:600]); print("---")
          PY

# ── fin du fichier ──
# (ces lignes de commentaire servent de marge : si le collage
#  depuis l iPhone coupe la fin, il ne coupe que ces lignes)
