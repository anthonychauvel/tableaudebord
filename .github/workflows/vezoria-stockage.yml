# Vezoria — chaque jour : relève les installations et la place du stockage Cloudflare,
# les écrit dans vezoria.json (affiché sur l'accueil du tableau de bord), et ouvre une
# « issue » (GitHub t'envoie un mail) si les photos dépassent 70 % de la limite
# (9 Go sur les 10 Go gratuits de Cloudflare R2).
# Secrets de ce dépôt (Settings → Secrets and variables → Actions → Repository secrets) :
#   VEZORIA_URL        ex. https://vezoria.pages.dev   (sans / à la fin)
#   VEZORIA_STATS_KEY  la même valeur que la variable STATS_KEY du projet Cloudflare Pages
#
# Minute décalée (:13) : GitHub peut abandonner en silence un run programmé pile à l'heure ronde.
name: Vezoria stockage
on:
  schedule: [{ cron: '13 6 * * *' }]   # tous les jours à 6h13 UTC (8h13 à Paris l'été)
  workflow_dispatch:
permissions:
  contents: write                       # pour committer vezoria.json
  issues: write                         # pour l'alerte par mail
concurrency: { group: vezoria-stockage, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lire l'état du serveur
        id: st
        run: |
          CODE=$(curl -s -o rep.json -w "%{http_code}" -H "X-Stats-Key: ${{ secrets.VEZORIA_STATS_KEY }}" "${{ secrets.VEZORIA_URL }}/api/stats" || echo 000)
          J=$(cat rep.json 2>/dev/null); echo "Code HTTP : $CODE"; echo "$J" | head -c 300; echo
          case "$CODE" in
            200) ;;
            404) echo "➜ 404 : stats.js pas encore déployé, ou STATS_KEY absente côté Cloudflare (ajoute-la puis redéploie)"; echo "pct=-1" >> $GITHUB_OUTPUT; exit 0;;
            403) echo "➜ 403 : le mot de passe n'est pas le même dans GitHub (VEZORIA_STATS_KEY) et Cloudflare (STATS_KEY)"; echo "pct=-1" >> $GITHUB_OUTPUT; exit 0;;
            000) echo "➜ adresse injoignable : vérifie VEZORIA_URL (https://… sans / à la fin)"; echo "pct=-1" >> $GITHUB_OUTPUT; exit 0;;
            *) echo "pct=-1" >> $GITHUB_OUTPUT; exit 0;;
          esac
          echo "$J" | jq -e '.r2.pct' >/dev/null || { echo "➜ réponse inattendue : VEZORIA_URL pointe-t-elle bien sur Vezoria ?"; echo "pct=-1" >> $GITHUB_OUTPUT; exit 0; }
          echo "pct=$(echo "$J" | jq -r '.r2.pct')" >> $GITHUB_OUTPUT
          echo "gb=$(echo "$J" | jq -r '.r2.usedGb')" >> $GITHUB_OUTPUT
          echo "sp=$(echo "$J" | jq -r '.spaces')" >> $GITHUB_OUTPUT
          # installations (compteur public de l'appli)
          curl -s -o ins.json "${{ secrets.VEZORIA_URL }}/api/installs" || echo '{}' > ins.json
          jq -e '.total' ins.json >/dev/null 2>&1 || echo '{}' > ins.json
          echo "Installations : $(cat ins.json)"

      - name: Écrire vezoria.json pour le tableau de bord
        if: steps.st.outputs.pct != '-1'
        run: |
          OLD='{}'; [ -f vezoria.json ] && OLD=$(cat vezoria.json)
          JOUR=$(date -u +%Y-%m-%d)
          jq -n --argjson st "$(cat rep.json)" --argjson ins "$(cat ins.json)" --argjson old "$OLD" --arg jour "$JOUR" --arg maj "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            {maj:$maj,
             installs:$ins,
             stockage:{octets:$st.r2.used, max:$st.r2.max, pct:$st.r2.pct, carnets:$st.spaces, fiches:$st.records, gros:[$st.bigSpaces[]?.mb]},
             historique:((($old.historique // []) | map(select(.d != $jour))) + [{d:$jour, go:($st.r2.used/1e9), inst:($ins.total // null)}] | .[-120:])}
          ' > vezoria.json
          cat vezoria.json | head -c 400; echo
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add vezoria.json
          git diff --cached --quiet && { echo "Aucun changement."; exit 0; }
          git commit -m "Vezoria — relevé du $JOUR"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

      - name: Prévenir si besoin
        env:
          GH_TOKEN: ${{ github.token }}
          PCT: ${{ steps.st.outputs.pct }}
          GB: ${{ steps.st.outputs.gb }}
          SP: ${{ steps.st.outputs.sp }}
        run: |
          if [ "$PCT" = "-1" ]; then T="⚠️ Vezoria : le serveur ne répond pas à /api/stats"; B="Vérifie que le site est en ligne et que STATS_KEY est la même des deux côtés.";
          elif awk "BEGIN{exit !($PCT >= 70)}"; then T="⚠️ Vezoria : photos à $PCT % de la limite ($GB Go)"; B="Stockage photos : $GB Go sur 9 Go autorisés ($SP carnets). Au-delà de 10 Go, Cloudflare facture 0,015 \$/Go/mois. Pistes : passer à l'offre payante, ou relever MAX_TOTAL_R2 dans functions/api/photo.js.";
          else echo "OK : $PCT %"; exit 0; fi
          if gh issue list -R "$GITHUB_REPOSITORY" --state open --search "Vezoria in:title" --json number -q '.[0].number' | grep -q .; then echo "Alerte déjà ouverte"; exit 0; fi
          gh issue create -R "$GITHUB_REPOSITORY" --title "$T" --body "$B"
