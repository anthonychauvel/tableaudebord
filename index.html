<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Veille — tableau de bord</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0D1116">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --ink:#0A0D11; --ink2:#12161B; --ink3:#1B2027; --edge:#2E3742;
  --gold:#f0c040; --txt:#E8EDF2; --txt2:#8A97A5;
  --haute:#ff6b6b; --moyenne:#ffb454; --basse:#7d8a99; --ok:#4cd585; --bleu:#5aa9ff; --violet:#a88bff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(1100px 620px at 12% -8%, rgba(120,150,190,.16), transparent 60%),
    radial-gradient(900px 520px at 88% 108%, rgba(190,150,110,.10), transparent 62%),
    linear-gradient(168deg, #14181D 0%, #0D1116 46%, #0A0D11 100%);
  background-attachment:fixed;
  color:var(--txt);
  min-height:100vh; padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
button{font-family:inherit;}
a{color:var(--bleu);}

/* ── En-tête ── */
.hdr{padding:calc(14px + env(safe-area-inset-top)) 18px 6px;display:flex;align-items:center;gap:10px;}
.hdr .logo{font-size:26px;}
.hdr h1{font-size:18px;font-weight:800;line-height:1.1;}
.hdr .sub{font-size:11.5px;color:var(--txt2);margin-top:2px;}
.hdr .sp{flex:1;}
.btn-mini{background:var(--ink3);border:1px solid var(--edge);color:var(--txt);font-size:12px;font-weight:700;
  padding:8px 11px;border-radius:11px;cursor:pointer;white-space:nowrap;}

/* ── Vues ── */
.vue{display:none;}
.vue.active{display:block;animation:apparait .25s ease;}
@keyframes apparait{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── Météo (héros) ── */
.meteo{margin:8px 14px 14px;border-radius:22px;padding:18px 18px 16px;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.08);}
.meteo.calme{background:linear-gradient(140deg,#123524,#0f2a1d 60%,#10251c);}
.meteo.regarder{background:linear-gradient(140deg,#3a2a10,#2a1f0f 60%,#221a0f);}
.meteo.urgent{background:linear-gradient(140deg,#3b1417,#2a1012 60%,#210d0f);}
.meteo .emo{font-size:46px;line-height:1;}
.meteo h2{font-size:21px;font-weight:800;margin-top:8px;line-height:1.2;}
.meteo p{font-size:13px;color:rgba(255,255,255,.78);margin-top:6px;line-height:1.45;}
.meteo .cta{margin-top:14px;display:inline-flex;align-items:center;gap:8px;background:#fff;color:#111;border:none;
  font-size:14px;font-weight:800;padding:11px 16px;border-radius:14px;cursor:pointer;}
.meteo .bulle{position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%);}

/* ── Progression ── */
.prog{margin:0 14px 16px;background:var(--ink3);border:1px solid var(--edge);border-radius:16px;padding:12px 14px;}
.prog .l{display:flex;justify-content:space-between;font-size:12px;color:var(--txt2);margin-bottom:8px;}
.prog .l b{color:var(--txt);}
.barre{height:9px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;}
.barre i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok),#9be7b8);transition:width .4s;}

/* ── Titres de bloc ── */
.bloc-t{display:flex;align-items:center;gap:8px;margin:18px 18px 10px;font-size:15px;font-weight:800;}
.bloc-t small{font-weight:600;color:var(--txt2);font-size:11.5px;}

/* ── Cartes mission ── */
.carte{margin:0 14px 12px;background:linear-gradient(160deg,#1C222A,#13171D);border:1px solid var(--edge);
  border-radius:18px;overflow:hidden;}
.carte.fait{opacity:.55;}
.carte-hd{display:flex;gap:12px;padding:14px 14px 10px;align-items:flex-start;}
.carte .ico{flex:0 0 44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;
  background:rgba(255,255,255,.06);}
.carte .ico.haute{background:rgba(255,107,107,.16);}
.carte .ico.moyenne{background:rgba(255,180,84,.16);}
.carte .ico.basse{background:rgba(125,138,153,.16);}
.carte .quoi{font-size:14px;font-weight:800;line-height:1.3;}
.carte .qui{font-size:12px;color:var(--txt2);margin-top:3px;line-height:1.35;word-break:break-word;}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.tag{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--txt2);}
.tag.haute{background:rgba(255,107,107,.16);color:var(--haute);}
.tag.moyenne{background:rgba(255,180,84,.16);color:var(--moyenne);}
.tag.basse{background:rgba(125,138,153,.18);color:#b5c0cc;}
.tag.nouveau{background:var(--haute);color:#fff;}
.tag.fait{background:rgba(76,213,133,.18);color:var(--ok);}
.pourquoi{margin:0 14px 10px;font-size:12.5px;line-height:1.5;color:#c9d3dd;}
.etapes{margin:0 14px 10px;padding:10px 12px;background:rgba(90,169,255,.07);border:1px solid rgba(90,169,255,.18);border-radius:12px;}
.etapes .et{font-size:11px;font-weight:800;color:var(--bleu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.etapes ol{padding-left:18px;}
.etapes li{font-size:12.5px;line-height:1.5;margin:3px 0;}
.detail-brut{margin:0 14px 10px;}
.detail-brut summary{font-size:11.5px;color:var(--txt2);cursor:pointer;list-style:none;}
.detail-brut summary::-webkit-details-marker{display:none;}
.detail-brut summary::before{content:"▸ ";}
.detail-brut[open] summary::before{content:"▾ ";}
.detail-brut .txt{font-size:11.5px;color:var(--txt2);margin-top:6px;line-height:1.5;white-space:pre-line;word-break:break-word;}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:4px 14px 14px;}
.act{flex:1 1 auto;min-width:0;background:rgba(255,255,255,.06);border:1px solid var(--edge);color:var(--txt);
  font-size:12.5px;font-weight:700;padding:10px 10px;border-radius:12px;cursor:pointer;text-align:center;text-decoration:none;}
.act.ok{background:rgba(76,213,133,.14);border-color:rgba(76,213,133,.35);color:var(--ok);}
.act.lien{color:var(--bleu);}

/* ── Thèmes ── */
.tuiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px 14px;}
.tuile{background:linear-gradient(160deg,#1C222A,#13171D);border:1px solid var(--edge);border-radius:18px;padding:13px;
  cursor:pointer;text-align:left;color:var(--txt);min-height:96px;display:flex;flex-direction:column;justify-content:space-between;}
.tuile .te{font-size:24px;}
.tuile .tn{font-size:12.5px;font-weight:800;line-height:1.25;margin-top:6px;}
.tuile .tc{font-size:11px;color:var(--txt2);margin-top:3px;}
.tuile.alerte-h{border-color:rgba(255,107,107,.45);}
.tuile.alerte-m{border-color:rgba(255,180,84,.4);}
.tuile .pastille{display:inline-block;margin-left:4px;font-size:10px;font-weight:800;padding:1px 7px;border-radius:99px;}
.retour{display:inline-flex;align-items:center;gap:6px;margin:6px 16px 10px;background:none;border:none;color:var(--bleu);
  font-size:14px;font-weight:700;cursor:pointer;}
.grp{margin:0 0 6px;}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 18px;font-size:12.5px;font-weight:800;color:var(--txt);}
.grp>summary::-webkit-details-marker{display:none;}
.grp>summary .gl::before{content:"\25B8  ";color:var(--txt2);}
.grp[open]>summary .gl::before{content:"\25BE  ";}
.grp-n{background:rgba(255,255,255,.07);border-radius:99px;padding:1px 9px;font-size:11px;font-weight:800;color:var(--txt2);}
.grp.g-nouveau>summary{color:var(--haute);}

/* ── Lexique ── */
.lex{margin:0 14px 12px;display:grid;gap:8px;}
.lex details{background:var(--ink3);border:1px solid var(--edge);border-radius:14px;padding:11px 13px;}
.lex summary{font-size:13px;font-weight:800;cursor:pointer;list-style:none;}
.lex summary::-webkit-details-marker{display:none;}
.lex p{font-size:12.5px;color:#c9d3dd;line-height:1.5;margin-top:6px;}

/* ── Divers ── */
.vide{padding:22px 18px;font-size:13px;color:var(--txt2);text-align:center;line-height:1.5;}
.pied{padding:14px 18px 4px;font-size:10.5px;color:var(--txt2);text-align:center;}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:#fff;color:#111;font-size:13px;font-weight:700;padding:10px 16px;border-radius:12px;opacity:0;transition:all .25s;
  z-index:50;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
input.rech{width:100%;background:var(--ink3);border:1px solid var(--edge);color:var(--txt);font-size:14px;
  padding:11px 13px;border-radius:12px;margin:4px 0 10px;}
.ligne{background:var(--ink3);border:1px solid var(--edge);border-radius:14px;padding:11px 13px;margin-bottom:8px;}
.ligne .t{font-size:13px;font-weight:700;}
.ligne .d{font-size:11.5px;color:var(--txt2);margin-top:3px;line-height:1.5;}

/* ── Barre d'onglets ── */
.onglets{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(12,15,19,.92);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--edge);}
.onglet{flex:1;background:none;border:none;color:var(--txt2);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;
  align-items:center;gap:3px;cursor:pointer;padding:4px 0;position:relative;}
.onglet .oe{font-size:21px;line-height:1;filter:grayscale(.6);opacity:.8;}
.onglet.active{color:var(--txt);}
.onglet.active .oe{filter:none;opacity:1;}
.onglet .pt{position:absolute;top:0;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:99px;background:var(--haute);
  color:#fff;font-size:9.5px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px;}
</style>
</head>
<body>

<div id="gate" style="position:fixed;inset:0;z-index:999;background:#0A0D11;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <div style="font-size:34px;margin-bottom:14px;">🔒</div>
  <div style="color:#8A97A5;font-size:13px;margin-bottom:18px;">Code d'accès</div>
  <input id="gateCode" type="tel" inputmode="numeric" autocomplete="off" maxlength="12"
    style="background:#1B2027;border:1px solid #2E3742;border-radius:12px;color:#E8EDF2;
    font-size:20px;letter-spacing:4px;text-align:center;padding:14px 18px;width:220px;">
  <div id="gateErr" style="color:#e05c5c;font-size:12px;margin-top:10px;height:16px;"></div>
</div>

<div id="app" style="display:none;">

<div class="hdr">
  <div class="logo">🦉</div>
  <div><h1>Ma veille</h1><div class="sub" id="hdrSub">Chargement…</div></div>
  <div class="sp"></div>
  <button class="btn-mini" onclick="exporterTexte()">⬇️ Export</button>
</div>

<!-- ACCUEIL -->
<section class="vue active" id="v-accueil">
  <div id="meteo"></div>
  <div id="progression"></div>
  <div class="bloc-t">🎯 Ce que tu as à faire <small id="missionCompte"></small></div>
  <div id="mission"></div>
  <div class="bloc-t">📚 Les mots à connaître</div>
  <div class="lex" id="lexique"></div>
  <div class="pied" id="pied"></div>
</section>

<!-- THÈMES -->
<section class="vue" id="v-themes">
  <div class="bloc-t">🗂️ Tout, rangé par thème <small>touche une tuile</small></div>
  <div class="tuiles" id="tuiles"></div>
</section>
<section class="vue" id="v-theme">
  <button class="retour" onclick="allerA('themes')">‹ Thèmes</button>
  <div class="bloc-t" id="themeTitre"></div>
  <div id="themeCorps"></div>
</section>

<!-- HISTORIQUE -->
<section class="vue" id="v-historique">
  <div class="bloc-t">📜 Les passages précédents <small>un par run de la veille</small></div>
  <div style="padding:0 14px" id="listeHistorique"></div>
  <div style="padding:0 14px" id="detailHistorique"></div>
</section>

<!-- RÈGLES CCN -->
<section class="vue" id="v-regles">
  <div class="bloc-t">📋 Règles des conventions <small>heures sup, contingent</small></div>
  <div style="padding:0 14px">
    <input id="rechercheCCN" class="rech" type="text" placeholder="🔍 IDCC, nom, secteur…" oninput="filtrerReglesCCN()">
    <div id="compteurReglesCCN" style="font-size:11.5px;color:var(--txt2);margin-bottom:8px;"></div>
    <div id="listeReglesCCN"></div>
  </div>
</section>

<nav class="onglets">
  <button class="onglet active" data-v="accueil" onclick="allerA('accueil')"><span class="oe">🏠</span>Accueil<span class="pt" id="ptAccueil"></span></button>
  <button class="onglet" data-v="themes" onclick="allerA('themes')"><span class="oe">🗂️</span>Thèmes</button>
  <button class="onglet" data-v="historique" onclick="allerA('historique')"><span class="oe">📜</span>Historique</button>
  <button class="onglet" data-v="regles" onclick="allerA('regles')"><span class="oe">📋</span>Règles CCN</button>
</nav>
<div class="toast" id="toast"></div>

</div><!-- #app -->

<script>
/* ════════════════════════════════════════════════════════════════════════
   Ma veille — refonte « guidée » du 22/09/2026.
   Même donnees.json qu'avant, mêmes fonctions (historique, règles CCN, export
   .zip, code d'accès). Ce qui change : chaque alerte est traduite en langage
   simple, avec POURQUOI c'est important et QUOI FAIRE, étape par étape.
   « C'est fait » est gardé dans CE téléphone (localStorage), rien n'est écrit
   dans le dépôt : pour qu'une alerte ne revienne plus, il faut une exception
   (bouton « Copier l'exception »).
   ════════════════════════════════════════════════════════════════════════ */

// Thèmes (sections de donnees.json) : nom simple + emoji + phrase d'explication.
const THEMES = {
  croisement:{e:'🔔', n:'Nouveaux textes pour une convention en attente', x:"Un texte vient de paraître pour une convention dont la grille attend une mise à jour."},
  grilles:{e:'💶', n:'Grilles de salaires', x:"Les salaires minimum de chaque convention affichés dans GrillePaye."},
  smic:{e:'📈', n:'SMIC', x:"La valeur du SMIC utilisée par l'appli."},
  droit:{e:'⚖️', n:'MonLegiTexte', x:"Le moteur de recherche d'articles de loi de l'écosystème."},
  modules:{e:'🧩', n:'Les 8 modules', x:"Les grands écrans de l'appli (compteur annuel, paye, Mizuki, Zenji…)."},
  outils:{e:'🧰', n:'Les 105 outils', x:"Les petits calculateurs de la rubrique Outils."},
  guide:{e:'📖', n:'Le guide (site)', x:"Les pages du site simulateurheuressupfrance.fr."},
  citations:{e:'📝', n:'Articles de loi cités', x:"Les références d'articles écrites dans le guide et les modules."},
  syntaxe:{e:'🧱', n:'Code qui ne se lit plus', x:"Un fichier dont le code est mal écrit : la page ne s'ouvre plus du tout."},
  pages:{e:'📱', n:'Pages qui ne se chargent plus', x:"Chaque page de l'appli est ouverte pour de vrai, comme sur un téléphone."},
  structure:{e:'🏗️', n:'Structure', x:"Organisation des outils et informations pour Google."},
  noindex:{e:'🙈', n:'MonLegiTexte reste caché de Google', x:"MonLegiTexte doit rester hors de Google, volontairement."},
  contenu:{e:'✍️', n:'Articles de loi modifiés', x:"Un article cité a changé de texte depuis la dernière vérification."},
  changements:{e:'🔄', n:'Fichiers modifiés', x:"Simple constat : ce qui a changé dans tes dépôts depuis le dernier passage."},
  age:{e:'⏳', n:'Âge des grilles', x:"Depuis combien de temps chaque grille n'a pas bougé."},
};

// Guide par TYPE d'alerte : quoi (phrase simple), pourquoi, étapes.
// {cle} = identifiant de l'alerte (IDCC 1234, nom de fichier…), remplacé à l'affichage.
const GUIDE = {
  'texte-pour-ccn-en-alerte':{e:'🔔', quoi:"Un nouveau texte est sorti pour {cle}",
    pourquoi:"Cette convention attendait une mise à jour de sa grille. Le texte qui vient de paraître contient peut-être les nouveaux salaires : c'est souvent la façon la plus rapide de lever une alerte.",
    etapes:["Lis le détail ci-dessous : il cite le texte paru (Journal officiel ou accord).","Ouvre ce texte et regarde s'il contient un tableau de salaires minimum.","Si oui : reporte les montants dans GrillePaye (RUNBOOK de hs, « Mettre à jour une grille »).","Si non : copie l'exception ci-dessous et colle-la dans exceptions.json."]},
  'grille-perimee':{e:'📅', quoi:"La grille de {cle} a pris du retard",
    pourquoi:"Le fonds juridique contient un texte de salaires plus récent que la grille affichée aux utilisateurs. Ils voient peut-être d'anciens minimum.",
    etapes:["Lis le détail : il donne le texte plus récent et ses premiers montants.","Compare avec la grille affichée dans GrillePaye pour cette convention.","Si les montants ont changé : mets la grille à jour (RUNBOOK de hs).","Si c'est un faux retard (texte d'une autre région, date d'application antérieure) : copie l'exception."]},
  'grille-sur-texte-ancien':{e:'🧮', quoi:"La grille de {cle} a été faite avec un ancien texte",
    pourquoi:"Les montants de la grille correspondent à un texte qui a été remplacé par un plus récent. Les salaires affichés sont donc probablement dépassés.",
    etapes:["Lis le détail : il nomme l'ancien et le nouveau texte.","Ouvre le nouveau texte et relève ses montants.","Remplace les montants dans la grille (RUNBOOK de hs, « Mettre à jour une grille »)."]},
  'grille-a-creer':{e:'➕', quoi:"{cle} n'a pas encore de grille",
    pourquoi:"Le fonds a un texte de salaires pour cette convention, mais l'appli n'en affiche qu'une estimation. Une vraie grille serait plus juste.",
    etapes:["Ouvre le texte cité dans le détail.","Recopie la grille ligne par ligne dans ccn-data.json.","Régénère _B64 dans GrillePaye/index.html (sinon rien ne change en ligne).","Pas le temps ? Copie l'exception : l'alerte reviendra seulement si un texte plus récent arrive."]},
  'grille-ancienne':{e:'🕰️', quoi:"La grille de {cle} n'a pas bougé depuis longtemps",
    pourquoi:"Ce n'est pas forcément une erreur : beaucoup de branches ne renégocient pas chaque année.",
    etapes:["Regarde si un texte plus récent existe (au fonds ou sur Légifrance).","S'il n'y a rien : rien à faire, ou copie l'exception pour ne plus la voir."]},
  'grille-sans-date':{e:'❔', quoi:"La grille de {cle} n'a pas de date",
    pourquoi:"Sans date, la veille ne peut pas savoir si la grille est à jour.",
    etapes:["Dans ccn-data.json, ajoute le champ « d » à cette grille, au format JJ/MM/AAAA."]},
  'grille-sous-smic':{e:'⬇️', quoi:"{cle} : des salaires conventionnels sous le SMIC",
    pourquoi:"La branche n'a pas renégocié depuis la dernière hausse du SMIC. L'appli affiche déjà le SMIC à la place, avec le montant conventionnel en petit : les utilisateurs voient le bon chiffre.",
    etapes:["Rien à corriger. C'est une information à surveiller.","Si un nouvel accord de salaires sort, la veille te le dira."]},
  'grilles-placeholder':{e:'🧩', quoi:"Des grilles provisoires à remplacer",
    pourquoi:"Ces grilles sont des estimations, pas des montants tirés d'un texte officiel.",
    etapes:["Pour chaque convention citée, cherche le texte de salaires officiel.","Remplace l'estimation par les vrais montants."]},
  'lien-mort-grillepaye':{e:'🔗', quoi:"Un lien « Voir le texte officiel » ne mène à rien",
    pourquoi:"Le lecteur tombe sur une fiche vide dans MonLegiTexte.",
    etapes:["Vérifie que la convention citée existe bien dans le fonds (idcc_list.txt).","Sinon, corrige ou retire le lien dans GrillePaye/index.html."]},
  'smic-revalorisation':{e:'📈', quoi:"Le SMIC vient d'augmenter",
    pourquoi:"Un nouveau texte de revalorisation est paru. Tant que l'appli n'est pas mise à jour, elle affiche l'ancien SMIC.",
    etapes:["Relève le nouveau montant mensuel et sa date d'effet dans le texte cité.","GrillePaye/index.html : change SMIC_DEF, SDATE_DEF et SSRC_DEF.","GrillePaye/ccn-data.json : change _smic et _smic_date, puis régénère _B64.","sw.js : augmente CACHE_NAME. Aucune ligne de grille à reprendre, elles suivent toutes seules."]},
  'smic-incoherent':{e:'⚠️', quoi:"L'appli n'a pas le même SMIC partout",

const DEPOT_HS = 'https://github.com/tonytonic/hs/blob/Android-cloudfare-production/';

const CLE_FAIT = 'veille_fait_v1';

function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// Même règle que cle_stable() dans construire-donnees.py : ce qui précède « : ».
function ident(a){var t=a.titre||'';return t.indexOf(' : ')>=0?t.split(' : ')[0].trim():t.trim();}
function cleAlerte(a){return (a.categorie||'')+'::'+ident(a);}

function lireFait(){try{return JSON.parse(localStorage.getItem(CLE_FAIT)||'{}')||{};}catch(e){return {};}}
function ecrireFait(f){try{localStorage.setItem(CLE_FAIT,JSON.stringify(f));}catch(e){}}
let FAIT = lireFait();

function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('on');},2200);}

// --- Rendu d'une alerte en carte guidée ------------------------------------
function carte(a){
  var g=GUIDE[a.categorie], k=cleAlerte(a), id=ident(a), fait=!!FAIT[k];
  var quoi = g ? g.quoi.replace('{cle}', id) : (a.titre||'');
  var emo = g ? g.e : ((THEMES[a._theme]||{}).e || '🔎');
  var etapes = g ? g.etapes : (CONSEILS[a.categorie] ? [CONSEILS[a.categorie]] : ["Lis le détail ci-dessous pour comprendre de quoi il s'agit."]);
  var niv = NIVEAU[a.gravite] || NIVEAU.basse;
  var fichier = /^[\w./-]+\.(html|js|css|json)$/.test(id) ? id : '';
  var html = '<div class="carte'+(fait?' fait':'')+'" data-k="'+esc(k)+'">'
    + '<div class="carte-hd"><div class="ico '+esc(a.gravite)+'">'+emo+'</div><div style="min-width:0">'
    + '<div class="quoi">'+esc(quoi)+'</div>'
    + (g ? '<div class="qui">'+esc(a.titre||'')+'</div>' : '')
    + '<div class="tags"><span class="tag '+esc(a.gravite)+'">'+niv.t+'</span>'
    + (a.nouveau?'<span class="tag nouveau">NOUVEAU</span>':'')
    + (fait?'<span class="tag fait">✓ traité</span>':'')
    + (a._theme&&THEMES[a._theme]?'<span class="tag">'+THEMES[a._theme].e+' '+esc(THEMES[a._theme].n)+'</span>':'')
    + '</div></div></div>'
    + (g&&g.pourquoi ? '<div class="pourquoi">💡 '+esc(g.pourquoi)+'</div>' : '')
    + '<div class="etapes"><div class="et">👣 Que faire</div><ol>'+etapes.map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ol></div>'
    + (a.detail ? '<details class="detail-brut"><summary>Voir le détail technique</summary><div class="txt">'+esc(a.detail)+'</div></details>' : '')
    + '<div class="actions">'
    + '<button class="act ok" onclick="basculerFait(this)">'+(fait?'↩️ Pas encore fait':'✅ C\'est fait')+'</button>'
    + '<button class="act" onclick="copierException(this)">📋 Copier l\'exception</button>'
    + (fichier ? '<a class="act lien" href="'+DEPOT_HS+esc(fichier)+'" target="_blank" rel="noopener">📂 Ouvrir le fichier</a>' : '')
    + (a.lien ? '<a class="act lien" href="'+esc(a.lien)+'" target="_blank" rel="noopener">🔗 Voir l\'article</a>' : '')
    + '</div></div>';
  return html;
}

function trouverAlerte(k){var r=null;(window.__DONNEES.sections||[]).forEach(function(s){(s.alertes||[]).forEach(function(a){if(cleAlerte(a)===k)r=a;});});return r;}

function basculerFait(btn){
  var k=btn.closest('.carte').getAttribute('data-k');
  if(FAIT[k]){delete FAIT[k];toast('Remis dans la liste');} else {FAIT[k]=new Date().toISOString().slice(0,10);toast('Bien joué ! 🎉');}
  ecrireFait(FAIT);rendreTout();
}

function copierException(btn){
  var a=trouverAlerte(btn.closest('.carte').getAttribute('data-k'));if(!a)return;
  var ex={categorie:a.categorie,cle:ident(a),note:'Vérifié — rien à changer',date:new Date().toISOString().slice(0,10)};
  var txt=JSON.stringify(ex, null, 2)+',';
  var fin=function(){toast('Copié ! Colle-le dans exceptions.json');setTimeout(function(){if(confirm("Ouvrir exceptions.json sur GitHub pour le coller ?\n\nColle-le juste après le premier « [ ».\nL'alerte disparaîtra au prochain passage de la veille."))window.open(EDIT_EXCEPTIONS,'_blank');},400);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(fin,function(){prompt('Copie ce texte :',txt);});}
  else prompt('Copie ce texte :',txt);
}

// --- Accueil -------------------------------------------------------------
function toutesAlertes(){
  var out=[];(window.__DONNEES.sections||[]).forEach(function(s){(s.alertes||[]).forEach(function(a){a._theme=s.id;out.push(a);});});return out;
}
function priorite(a){return (a.nouveau?0:10)+((NIVEAU[a.gravite]||NIVEAU.basse).o*3);}

function rendreAccueil(){
  var toutes=toutesAlertes();
  var aFaire=toutes.filter(function(a){return a.gravite!=='basse'||a.nouveau;});
  var restantes=aFaire.filter(function(a){return !FAIT[cleAlerte(a)];});
  var urgentes=restantes.filter(function(a){return a.gravite==='haute';});
  var nouv=restantes.filter(function(a){return a.nouveau;});
  var etat = urgentes.length ? 'urgent' : (restantes.length ? 'regarder' : 'calme');
  var M = {
    calme:{e:'😌', h:'Tout est calme', p:"Rien d'important à faire. La veille continue de surveiller pour toi lundi, mercredi et jeudi."},
    regarder:{e:'🧐', h:restantes.length+' chose'+(restantes.length>1?'s':'')+' à regarder', p:"Rien d'urgent, mais quelques points méritent un coup d'œil quand tu as un moment."},
    urgent:{e:'🚨', h:urgentes.length+' chose'+(urgentes.length>1?'s':'')+' à faire vite', p:"Commence par la première carte ci-dessous : chaque étape est expliquée."},
  }[etat];
  if(nouv.length) M.p = '🆕 '+nouv.length+' nouveauté'+(nouv.length>1?'s':'')+' depuis le dernier passage. '+M.p;
  document.getElementById('meteo').innerHTML='<div class="meteo '+etat+'"><div class="bulle"></div><div class="emo">'+M.e+'</div><h2>'+esc(M.h)+'</h2><p>'+esc(M.p)+'</p>'
    +(restantes.length?'<button class="cta" onclick="document.getElementById(\'mission\').scrollIntoView({behavior:\'smooth\'})">👉 Par où commencer</button>':'<button class="cta" onclick="allerA(\'themes\')">🗂️ Voir tout par thème</button>')+'</div>';
  var faits=aFaire.length-restantes.length, pc=aFaire.length?Math.round(100*faits/aFaire.length):100;
  document.getElementById('progression').innerHTML=aFaire.length?'<div class="prog"><div class="l"><span>Ta progression</span><span><b>'+faits+'</b> / '+aFaire.length+' traitée'+(faits>1?'s':'')+'</span></div><div class="barre"><i style="width:'+pc+'%"></i></div></div>':'';
  var liste=restantes.slice().sort(function(a,b){return priorite(a)-priorite(b);});
  var montrees=liste.slice(0,8);
  document.getElementById('missionCompte').textContent=liste.length?(liste.length>8?'les 8 plus importantes sur '+liste.length:liste.length+' en tout'):'';
  document.getElementById('mission').innerHTML=montrees.length?montrees.map(carte).join('')
    +(liste.length>8?'<div class="vide">Les autres sont dans l\'onglet 🗂️ Thèmes.</div>':'')
    :'<div class="vide">🎉 Rien à faire pour l\'instant.<br>Les points « pour info » sont dans l\'onglet 🗂️ Thèmes.</div>';
  var pt=document.getElementById('ptAccueil');pt.textContent=urgentes.length;pt.style.display=urgentes.length?'flex':'none';
  var tot=toutes.length;
  document.getElementById('pied').textContent=tot+' point'+(tot>1?'s':'')+' surveillé'+(tot>1?'s':'')+' en tout, dont '+(tot-aFaire.length)+' pour info · '+(window.__DONNEES.exceptions_appliquees||0)+' masqué(s) par tes exceptions';
}

// --- Thèmes --------------------------------------------------------------
function rendreThemes(){
  var d=window.__DONNEES;
  document.getElementById('tuiles').innerHTML=d.sections.map(function(s,i){
    var th=THEMES[s.id]||{e:'🔎',n:s.titre||s.id};
    var al=s.alertes||[], n=al.length, h=al.filter(function(a){return a.gravite==='haute'&&!FAIT[cleAlerte(a)];}).length,
        m=al.filter(function(a){return a.gravite==='moyenne'&&!FAIT[cleAlerte(a)];}).length;
    var cls=h?' alerte-h':(m?' alerte-m':'');
    var etat = s.non_construit ? 'pas encore branché' : (n? n+' point'+(n>1?'s':'') : '✓ rien à signaler');
    return '<button class="tuile'+cls+'" onclick="ouvrirTheme('+i+')"><div class="te">'+th.e+'</div><div><div class="tn">'+esc(th.n)+'</div><div class="tc">'+etat
      +(h?'<span class="pastille" style="background:rgba(255,107,107,.18);color:var(--haute)">'+h+' vite</span>':'')+'</div></div></button>';
  }).join('');
}

function _ageDetail(a){var det=a.detail||'';var mj=det.match(/\((\d+)\s*jours?\)/);if(!mj)return null;var md=det.match(/(\d{2}\/\d{2}\/\d{4})/);return {days:parseInt(mj[1],10),date:md?md[1]:''};}
// Même regroupement qu'avant (sert aussi à l'export).
function _grouperAlertes(alertes, ordreGravite){
  var og = ordreGravite || {haute:0,moyenne:1,basse:2};
  var tri = function(arr){ return arr.sort(function(a,b){ return (og[a.gravite]??9)-(og[b.gravite]??9); }); };
  var nouv=[], v12=[], v3=[], frais=[], sansdate=[];
  (alertes||[]).forEach(function(a){
    if(a.nouveau){ nouv.push(a); return; }
    var ai=_ageDetail(a);
    if(!ai) sansdate.push(a);
    else if(ai.days>=365) v12.push(a);
    else if(ai.days>=90) v3.push(a);
    else frais.push(a);
  });
  var g=[];
  if(nouv.length) g.push({cle:'nouveau', label:'🆕 Nouveau depuis le dernier passage', ouvert:true, alertes:tri(nouv)});
  if(v12.length) g.push({cle:'v12', label:'⏳ Plus de 12 mois — à revérifier', ouvert:true, alertes:tri(v12)});
  if(v3.length) g.push({cle:'v3', label:'📅 De 3 à 12 mois — signal précoce', ouvert:false, alertes:tri(v3)});
  if(frais.length) g.push({cle:'frais', label:'🕐 Moins de 3 mois — récent', ouvert:false, alertes:tri(frais)});
  if(sansdate.length) g.push({cle:'sansdate', label:'Déjà vu — inchangé depuis le dernier passage', ouvert:false, alertes:tri(sansdate)});
  return g;
}

let THEME_OUVERT = -1;
function ouvrirTheme(i){
  THEME_OUVERT=i;
  var s=window.__DONNEES.sections[i], th=THEMES[s.id]||{e:'🔎',n:s.titre||s.id,x:''};
  document.getElementById('themeTitre').innerHTML=th.e+' '+esc(th.n)+(th.x?'<small style="display:block;margin-top:3px">'+esc(th.x)+'</small>':'');
  var al=(s.alertes||[]).map(function(a){a._theme=s.id;return a;});
  var corps;
  if(s.non_construit) corps='<div class="vide">Ce thème n\'est pas encore branché.</div>';
  else if(!al.length) corps='<div class="vide">✅ Rien à signaler ici.</div>';
  else corps=_grouperAlertes(al).map(function(g){
    return '<details class="grp g-'+g.cle+'"'+(g.ouvert?' open':'')+'><summary><span class="gl">'+g.label+'</span><span class="grp-n">'+g.alertes.length+'</span></summary>'+g.alertes.map(carte).join('')+'</details>';
  }).join('');
  document.getElementById('themeCorps').innerHTML=corps;
  allerA('theme');
}

// --- Navigation ------------------------------------------------------------
function allerA(v){
  document.querySelectorAll('.vue').forEach(function(x){x.classList.remove('active');});
  document.getElementById('v-'+v).classList.add('active');
  var onglet = v==='theme' ? 'themes' : v;
  document.querySelectorAll('.onglet').forEach(function(o){o.classList.toggle('active',o.getAttribute('data-v')===onglet);});
  if(v!=='theme') window.scrollTo(0,0);
  if(v==='historique' && !historiqueCharge){historiqueCharge=true;chargerListeHistorique();}
  if(v==='regles' && !reglesCCN) chargerReglesCCN();
}

function rendreTout(){
  if(!window.__DONNEES) return;
  rendreAccueil(); rendreThemes();
  if(document.getElementById('v-theme').classList.contains('active') && THEME_OUVERT>=0){
    var y=window.scrollY; ouvrirTheme(THEME_OUVERT); window.scrollTo(0,y);
  }
}

async function charger(){
  let d;
  try{
    const r = await fetch('donnees.json', {cache:'no-cache'});
    d = await r.json();
    window.__DONNEES = d;
  }catch(e){
    document.getElementById('hdrSub').textContent = 'Données indisponibles hors ligne.';
    document.getElementById('meteo').innerHTML='<div class="meteo regarder"><div class="emo">📡</div><h2>Pas de réseau</h2><p>Reconnecte-toi pour voir le dernier passage de la veille.</p></div>';
    return;
  }
  const genere = new Date(d.genere);
  document.getElementById('hdrSub').textContent = 'Dernier passage : ' + genere.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}) + ' à ' +
    genere.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('lexique').innerHTML = LEXIQUE.map(function(l){return '<details><summary>❓ '+esc(l[0])+'</summary><p>'+esc(l[1])+'</p></details>';}).join('');
  // Nettoyage : oublier les « c'est fait » d'alertes qui ont disparu des données.
  var presentes={}; toutesAlertes().forEach(function(a){presentes[cleAlerte(a)]=1;});
  Object.keys(FAIT).forEach(function(k){if(!presentes[k])delete FAIT[k];}); ecrireFait(FAIT);
  rendreTout();
}

let reglesCCN = null;
async function chargerReglesCCN(){
  const conteneur = document.getElementById('listeReglesCCN');
  try{
    const r = await fetch('ccn-regles.json', {cache:'no-cache'});
    const d = await r.json();
    reglesCCN = d.entrees;
    document.getElementById('compteurReglesCCN').textContent = `${d.entrees.length} conventions — source app v${d.versionSource}`;

function ligneTaux(e){
  let s = `${e.taux1}% (à partir de la ${e.palier1}e h)`;
  if(e.taux_inter != null) s += ` → ${e.taux_inter}% (à partir de la ${e.palier_inter}e h)`;
  s += ` → ${e.taux2}%`;
  return s;
}
function filtrerReglesCCN(){
  if(!reglesCCN) return;
  const q = document.getElementById('rechercheCCN').value.trim().toLowerCase();
  let resultats = reglesCCN;
  if(q){
    resultats = reglesCCN.filter(e =>
      String(e.idcc).includes(q) || (e.nom||'').toLowerCase().includes(q) || (e.secteur||'').toLowerCase().includes(q));
  }
  const conteneur = document.getElementById('listeReglesCCN');
  const AFFICHES = resultats.slice(0, 40);
  conteneur.innerHTML = AFFICHES.map(e => `
    <div class="ligne">
      <div class="t">${esc(e.nom)} <span style="color:var(--txt2);font-weight:400">— IDCC ${e.idcc}</span></div>
      <div class="d">⏱️ Majoration des heures sup : ${esc(ligneTaux(e))}<br>📦 Contingent annuel : ${e.contingent} h · Seuil : ${e.seuil} h/semaine
        ${e.notes ? `<div style="margin-top:5px;color:#9fc3a8">📖 ${esc(e.notes)}</div>` : ''}</div>
    </div>`).join('') || '<div class="vide">Aucune convention ne correspond.</div>';
  if(resultats.length > AFFICHES.length){
    conteneur.innerHTML += `<div class="vide">… et ${resultats.length - AFFICHES.length} de plus — précise la recherche.</div>`;
  }
}

// --- Export .zip (inchangé) --------------------------------------------------
var _crcTable=(function(){var t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++){c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);}t[n]=c>>>0;}return t;})();
function _crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++){c=_crcTable[(c^b[i])&0xFF]^(c>>>8);}return (c^0xFFFFFFFF)>>>0;}
function _zipStore(files){
  var enc=new TextEncoder(),parts=[],central=[],offset=0;
  var _dt=new Date(),dosTime=((_dt.getHours()&31)<<11)|((_dt.getMinutes()&63)<<5)|((_dt.getSeconds()>>1)&31),dosDate=(((_dt.getFullYear()-1980)&127)<<9)|(((_dt.getMonth()+1)&15)<<5)|(_dt.getDate()&31);
  files.forEach(function(f){
    var nm=enc.encode(f.name),data=f.bytes,crc=_crc32(data);
    var lh=new Uint8Array(30+nm.length),dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0x0800,true);dv.setUint16(8,0,true);
    dv.setUint16(10,dosTime,true);dv.setUint16(12,dosDate,true);dv.setUint32(14,crc,true);dv.setUint32(18,data.length,true);
    dv.setUint32(22,data.length,true);dv.setUint16(26,nm.length,true);dv.setUint16(28,0,true);lh.set(nm,30);
    parts.push(lh);parts.push(data);
    var cd=new Uint8Array(46+nm.length),cv=new DataView(cd.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);
    cv.setUint16(10,dosTime,true);cv.setUint16(12,dosDate,true);cv.setUint16(14,0,true);cv.setUint32(16,crc,true);
    cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,nm.length,true);
    cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);
    cv.setUint32(38,0,true);cv.setUint32(42,offset,true);cd.set(nm,46);central.push(cd);
    offset+=lh.length+data.length;
  });
  var cSize=central.reduce(function(n,c){return n+c.length;},0);
  var eo=new Uint8Array(22),ev=new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);ev.setUint16(8,files.length,true);
  ev.setUint16(10,files.length,true);ev.setUint32(12,cSize,true);ev.setUint32(16,offset,true);ev.setUint16(20,0,true);
  var out=new Uint8Array(offset+cSize+22),pos=0;
  parts.forEach(function(c){out.set(c,pos);pos+=c.length;});
  central.forEach(function(c){out.set(c,pos);pos+=c.length;});
  out.set(eo,pos);return out;
}
function exporterTexte(){
  var d=window.__DONNEES;
  if(!d){ alert('Données pas encore chargées, réessaie dans un instant.'); return; }
  function p2(n){ return (n<10?'0':'')+n; }
  function fmtDate(x){ if(!x) return '\u2014'; var t=new Date(x); if(isNaN(t)) return String(x);
    return p2(t.getDate())+'/'+p2(t.getMonth()+1)+'/'+t.getFullYear()+' '+p2(t.getHours())+':'+p2(t.getMinutes()); }
  function slug(s){ return (String(s||'section').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,42))||'categorie'; }
  var now=new Date(), enc=new TextEncoder();
  var secs=d.sections.filter(function(s){ return (s.alertes||[]).length; });
  if(!secs.length){ alert('Aucune alerte : rien à exporter.'); return; }
  var dateGen=fmtDate(d.genere), dateExp=fmtDate(now), files=[];
  secs.forEach(function(s,idx){
    var al=s.alertes||[], L=[];
    L.push('VEILLE PERSO \u2014 '+String(s.titre||s.id||'?').toUpperCase());
    L.push(al.length+' alerte(s) dans cette categorie');
    L.push('Genere le : '+dateGen+'  \u00b7  Exporte le : '+dateExp);
    L.push('Cochez [x] au fur et a mesure des controles.');
    L.push(''.padEnd(60,'='));
    L.push('');
    _grouperAlertes(al).forEach(function(g){
      L.push('--- '+g.label+' ('+g.alertes.length+') ---');
      g.alertes.forEach(function(a){
        L.push('['+(FAIT[cleAlerte(a)]?'x':' ')+'] ('+(a.gravite||'?')+') '+String(a.titre||'').trim());
        if(a.detail) L.push('      '+String(a.detail).replace(/\s+/g,' ').trim());
      });
      L.push('');
    });
    files.push({ name:p2(idx+1)+'-'+slug(s.titre||s.id)+'.txt', bytes:enc.encode(L.join('\n')) });
  });
  var tot=secs.reduce(function(n,s){ return n+(s.alertes||[]).length; },0), nouv=0;
  d.sections.forEach(function(s){ (s.alertes||[]).forEach(function(a){ if(a.nouveau) nouv++; }); });
  var R=['VEILLE PERSO \u2014 RECAPITULATIF','Genere le : '+dateGen,'Exporte le : '+dateExp,
    'Total : '+tot+' alerte(s) \u00b7 '+nouv+' nouvelle(s) depuis le dernier passage','',''.padEnd(60,'='),'',
    'Un fichier .txt par categorie (a cocher [x] au fil des controles) :'];
  secs.forEach(function(s,idx){ R.push('  '+p2(idx+1)+'. '+(s.titre||s.id)+' \u2014 '+(s.alertes||[]).length+' alerte(s)'); });
  files.unshift({ name:'00-recapitulatif.txt', bytes:enc.encode(R.join('\n')) });
  var zip=_zipStore(files);
  var blob=new Blob([zip],{type:'application/zip'});
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='veille-controle-'+now.getFullYear()+p2(now.getMonth()+1)+p2(now.getDate())+'.zip';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ try{ document.body.removeChild(a); }catch(e){} URL.revokeObjectURL(url); }, 200);
}

    gate.style.display = 'none';
