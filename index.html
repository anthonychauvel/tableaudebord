<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Veille — tableau de bord</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0D1116">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --ink:#0A0D11; --ink2:#12161B; --ink3:#1B2027; --edge:#2E3742;
  --gold:#f0c040; --txt:#E8EDF2; --txt2:#8A97A5;
  --haute:#e05c5c; --moyenne:#e0a95c; --basse:#6b7684;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(1100px 620px at 12% -8%, rgba(120,150,190,.16), transparent 60%),
    radial-gradient(900px 520px at 88% 108%, rgba(190,150,110,.10), transparent 62%),
    linear-gradient(168deg, #14181D 0%, #0D1116 46%, #0A0D11 100%);
  color:var(--txt);
  min-height:100vh; padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
.hdr{padding:calc(16px + env(safe-area-inset-top)) 18px 10px;}
.hdr h1{font-size:19px;font-weight:800;}
.hdr .sub{font-size:12px;color:var(--txt2);margin-top:2px;}
.resume{display:flex;gap:10px;padding:4px 18px 14px;overflow-x:auto;}
.resume .pill{flex-shrink:0;background:var(--ink3);border:1px solid var(--edge);
  border-radius:12px;padding:8px 13px;text-align:center;min-width:64px;}
.resume .pill b{display:block;font-size:18px;}
.resume .pill span{font-size:9.5px;color:var(--txt2);text-transform:uppercase;letter-spacing:.4px;}
.resume .pill.haute b{color:var(--haute);}
.resume .pill.moyenne b{color:var(--moyenne);}
.resume .pill.basse b{color:var(--basse);}
.resume .pill.nouveau{border-color:var(--haute);}
.resume .pill.nouveau b{color:var(--haute);}

.section{margin:0 14px 12px;background:linear-gradient(160deg,#1B2027,#12161B);
  border:1px solid var(--edge);border-radius:16px;overflow:hidden;}
.section-hd{display:flex;align-items:center;justify-content:space-between;
  padding:13px 15px;cursor:pointer;}
.section-hd .titre{font-size:14.5px;font-weight:700;}
.section-hd .compte{font-size:11px;color:var(--txt2);margin-top:1px;}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;flex-shrink:0;}
.badge.zero{background:rgba(255,255,255,.05);color:var(--txt2);}
.badge.non-zero{background:rgba(224,92,92,.15);color:var(--haute);}
.chev{transition:transform .2s;color:var(--txt2);margin-left:8px;}
.section.open .chev{transform:rotate(90deg);}
.corps{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.alerte{padding:11px 15px;border-top:1px solid var(--edge);}
.alerte.nouveau{border-left:3px solid var(--haute);background:rgba(224,92,92,0.06);}
.alerte .badge-nouveau{display:inline-block;background:var(--haute);color:#fff;font-size:9px;
  font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;letter-spacing:.3px;vertical-align:middle;}
.alerte .t{font-size:13px;font-weight:600;line-height:1.35;display:flex;gap:7px;align-items:flex-start;}
.alerte .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.alerte .dot.haute{background:var(--haute);}
.alerte .dot.moyenne{background:var(--moyenne);}
.alerte .dot.basse{background:var(--basse);}
.alerte .d{font-size:11.5px;color:var(--txt2);margin-top:3px;margin-left:14px;line-height:1.5;}
.alerte .conseil{font-size:11px;color:#7FA88A;margin-top:5px;margin-left:14px;line-height:1.45;
  padding-left:8px;border-left:2px solid #2E4A38;}
.vide{padding:16px 15px;font-size:12.5px;color:var(--txt2);text-align:center;}
.non-construit{padding:14px 15px;font-size:12px;color:var(--txt2);text-align:center;
  border-top:1px dashed var(--edge);}
.pied{padding:16px 18px 4px;font-size:10.5px;color:var(--txt2);text-align:center;}
/* Sous-groupes par ancienneté / nouveauté à l'intérieur d'une section */
.grp{border-top:1px solid var(--edge);}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 15px;font-size:12px;font-weight:700;color:var(--txt);}
.grp>summary::-webkit-details-marker{display:none;}
.grp>summary .gl{display:flex;align-items:center;gap:7px;}
.grp>summary .gl::before{content:"\25B8";color:var(--txt2);font-size:10px;}
.grp[open]>summary .gl::before{content:"\25BE";}
.grp-n{background:rgba(255,255,255,.06);border-radius:99px;padding:1px 9px;font-size:11px;font-weight:800;color:var(--txt2);flex-shrink:0;}
.grp.g-nouveau>summary{color:var(--haute);}
.grp.g-nouveau .grp-n{background:rgba(224,92,92,.15);color:var(--haute);}
.grp.g-v12>summary{color:var(--moyenne);}
.grp .alerte:first-child{border-top:none;}
.age-chip{display:inline-block;margin-left:auto;font-size:9.5px;color:var(--txt2);background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:5px;padding:1px 6px;white-space:nowrap;flex-shrink:0;}
</style>
</head>
<body>

<div id="gate" style="position:fixed;inset:0;z-index:999;background:#0A0D11;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <div style="font-size:34px;margin-bottom:14px;">🔒</div>
  <div style="color:#8A97A5;font-size:13px;margin-bottom:18px;">Code d'accès</div>
  <input id="gateCode" type="tel" inputmode="numeric" autocomplete="off" maxlength="12"
    style="background:#1B2027;border:1px solid #2E3742;border-radius:12px;color:#E8EDF2;
    font-size:20px;letter-spacing:4px;text-align:center;padding:14px 18px;width:220px;">
  <div id="gateErr" style="color:#e05c5c;font-size:12px;margin-top:10px;height:16px;"></div>
</div>

<div id="app" style="display:none;">

<div class="hdr">
  <h1>🔎 Veille perso</h1>
  <div class="sub" id="hdrSub">Chargement…</div>
</div>

<div style="padding:0 18px 10px;display:flex;gap:8px;flex-wrap:wrap;">
  <button id="btnHistorique" onclick="basculerHistorique()"
    style="background:var(--ink3);border:1px solid var(--edge);color:var(--txt2);
    font-size:12px;padding:7px 13px;border-radius:10px;">📜 Historique</button>
  <button id="btnReglesCCN" onclick="basculerReglesCCN()"
    style="background:var(--ink3);border:1px solid var(--edge);color:var(--txt2);
    font-size:12px;padding:7px 13px;border-radius:10px;">📋 Règles CCN</button>
  <button id="btnExport" onclick="exporterTexte()"
    style="background:var(--ink3);border:1px solid var(--edge);color:var(--txt2);
    font-size:12px;padding:7px 13px;border-radius:10px;">⬇️ Export .txt</button>
</div>

<div class="resume" id="resume"></div>
<div id="sections"></div>
<div class="pied" id="pied"></div>

<div id="vueReglesCCN" style="display:none;padding:0 18px;">
  <input id="rechercheCCN" type="text" placeholder="IDCC, nom, secteur…" oninput="filtrerReglesCCN()"
    style="width:100%;box-sizing:border-box;background:var(--ink3);border:1px solid var(--edge);
    color:var(--txt);font-size:14px;padding:11px 13px;border-radius:12px;margin:14px 0 10px;">
  <div id="compteurReglesCCN" style="font-size:11.5px;color:var(--txt2);margin-bottom:8px;"></div>
  <div id="listeReglesCCN"></div>
</div>

<div id="vueHistorique" style="display:none;padding:0 18px;">
  <div id="listeHistorique"></div>
  <div id="detailHistorique"></div>
</div>

</div><!-- #app -->

<script>
const LIB = {grilles:'Grilles CCN', droit:'MonLegiTexte', modules:'8 modules',
             outils:'105 outils', guide:'Guide SEO', citations:'Citations juridiques',
             syntaxe:'Syntaxe JS', structure:'Structure', noindex:'MonLegiTexte (direct)',
             contenu:'Contenu des articles', changements:'Fichiers modifiés', age:'Âge de la référence',
             croisement:'Textes pour CCN en attente'};

// Un conseil par CATÉGORIE, pas par alerte individuelle -- les mêmes sujets
// reviennent, la correction typique aussi. Sert de mémoire courte : que faire
// concrètement, sans redériver la réponse à chaque fois.
const CONSEILS = {
  'grille-perimee': "Chercher un avenant plus récent sur Légifrance/BOCC pour cet IDCC. Si rien n'est publié à ce jour, ce n'est pas une correction en attente de ta part -- ajoute une exception dans exceptions.json avec une note \"rien publié sur Légifrance\" plutôt que de laisser l'alerte revenir indéfiniment.",
  'grille-a-creer': "Chercher le texte complet de l'avenant cité, en extraire la grille ligne par ligne, l'ajouter à ccn-data.json -- puis régénérer _B64, sinon la correction n'atteint jamais la production.",
  'grille-ancienne': "Pas forcément une erreur : vérifier juste si un avenant plus récent existe. Si la CCN n'a simplement pas renégocié depuis, rien à faire.",
  'grille-sans-date': "Champ 'd' manquant ou illisible dans ccn-data.json pour cette grille -- ajouter une date au format JJ/MM/AAAA.",
  'grille-sous-smic': "Vérifier si la note de source mentionne un motif documenté (indemnité différentielle, indiciaire...). Si oui, c'est normal, rien à faire : le bandeau applicatif gère déjà l'affichage. Si non, le SMIC s'applique automatiquement, rien à corriger côté grille.",
  'grilles-placeholder': "Grille non encore sourcée sur du réel -- chercher le texte officiel pour remplacer l'estimation SMIC par un vrai montant.",
  'hors-referentiel-dares': "Vérifier si l'IDCC existe encore sur la DARES/Légifrance. S'il a été retiré ou fusionné, mettre à jour ou retirer l'entrée.",
  'identite-divergente': "Le libellé ou le champ affiché ne correspond pas à ce que dit la source officielle -- comparer et corriger le nom ou l'identifiant.",

  'article-abroge': "Chercher l'article de remplacement sur Légifrance et mettre à jour la citation (articles-loi.js ou data-art selon l'endroit).",
  'article-abroge-ecosysteme': "Même chose, mais cité en texte brut dans le guide ou un module -- chercher l'occurrence exacte et remplacer la référence dans le texte.",
  'article-non-confirme': "Le fonds n'a pas (encore) ce texte -- pas forcément faux, juste pas vérifiable pour l'instant. Revoir si ça persiste sur plusieurs runs.",
  'citation-orpheline': "Article cité dans un outil mais absent d'articles-loi.js -- soit l'ajouter au référentiel, soit corriger la citation si c'est une coquille.",
  'citation-ecosysteme-non-confirmee': "Citation en texte brut dans le guide/un module, ni code travail ni code sécu ne la confirme -- vérifier la référence à la main.",
  'convention-perimee-sans-mention': "Le guide cite une CCN fusionnée sans le dire -- ajouter une mention (ex. \"désormais intégrée à IDCC X\") pour ne pas induire en erreur.",

  'lien-interne-casse': "Lien mort trouvé -- vérifier si la cible a été renommée/déplacée/supprimée, corriger le href ou retirer le lien.",
  'lien-mort-grillepaye': "Lien vers MonLegiTexte cassé pour cet IDCC -- vérifier le mapping IDCC->code dans GrillePaye/index.html.",
  'outil-fichier-manquant': "Une clé de TOOLS dans outils.html n'a pas de fichier -- soit créer le fichier manquant, soit retirer l'entrée si l'outil n'existe plus.",
  'outil-orphelin': "Le fichier existe mais n'est dans aucune catégorie -- l'ajouter à une catégorie de CATS dans outils.html, ou le supprimer s'il ne sert plus.",
  'asset-casse': "Image ou ressource introuvable -- vérifier le chemin, ou remplacer/retirer la référence si le fichier n'existe plus.",
  'module-absent-de-prod': "Module présent en bac à sable mais jamais déployé -- décider s'il faut le pousser en production ou l'exclure du suivi si ce n'est pas prévu.",
  'livrable-session': "Un livrable construit récemment n'est pas encore en ligne -- vérifier s'il doit encore être déployé ou si c'est un choix assumé de ne pas le faire.",

  'jsonld-invalide': "JSON-LD mal formé -- Google l'ignore silencieusement. Corriger la syntaxe JSON du bloc <script type=\"application/ld+json\"> sur la page citée.",
  'jsonld-incomplet': "Bloc JSON-LD valide mais sans @context/@type -- ajouter les champs manquants pour que Google puisse l'exploiter.",

  'syntaxe-js-cassee': "La page ne charge plus du tout -- ouvrir le fichier, chercher la ligne indiquée par le message de node --check, corriger la syntaxe.",

  'noindex-absent': "L'en-tête X-Robots-Tag noindex n'est plus envoyé en production -- vérifier le Worker Cloudflare déployé, pas seulement le code source.",
  'noindex-meta-absent': "Balise meta robots absente du HTML reçu -- vérifier qu'elle n'a pas été retirée par erreur d'un template.",
  'site-injoignable': "Le site ne répond pas au moment du run -- souvent temporaire (déploiement en cours, panne passagère). Vérifier si ça persiste avant de s'inquiéter.",

  'audit-introuvable': "Le dernier audit du fonds n'est pas accessible -- vérifier que audits/index.json existe et est à jour côté droit.",
  'changement-reel': "Un vrai changement de contenu a été détecté côté fonds depuis le dernier audit -- vérifier ce qui a changé et si ça impacte l'app.",
  'run-en-retard': "Le workflow ne s'est pas exécuté depuis longtemps -- vérifier qu'il est bien activé et programmé sur GitHub Actions.",
  'contenu-article-modifie': "Toujours en vigueur, mais le texte a changé depuis la dernière vérification -- ouvrir l'article sur Légifrance, comparer à ce que la logique de calcul suppose, ajuster si les seuils ou montants ont bougé.",
  'fichier-modifie': "Constat neutre -- vérifier que c'est un changement voulu (ta propre session de travail). Si tu ne reconnais pas ce changement, ouvrir le fichier et comparer à la version précédente sur GitHub.",
  'reference-plus-12-mois': "L'app affiche déjà ce bandeau aux utilisateurs sur l'onglet Référence -- vérifier s'il existe un avenant plus récent (chercher dans le fonds ou sur Légifrance), ou si une région couvre déjà le besoin sans qu'il soit nécessaire de toucher la référence elle-même.",
  'reference-plus-3-mois': "Pas encore visible par les utilisateurs, mais autant vérifier maintenant qu'une fois le bandeau affiché -- même logique : un avenant plus récent existe-t-il, une région couvre-t-elle déjà le besoin, ou rien de neuf pour l'instant.",
  'texte-pour-ccn-en-alerte': "Le plus utile à traiter en priorité : un texte vient de paraître pour une CCN que tu attendais. Ouvrir le texte cité (JORF ou accord), vérifier s'il contient la nouvelle grille, et si oui la reporter dans GrillePaye — ça lève l'alerte d'un coup.",
};

function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// --- Sous-groupement par ancienneté / nouveauté (affichage) ---
// La date + l'âge en jours sont déjà dans le texte du détail :
// "... Date de référence 15/01/2026 (207 jours) ...". On les lit ici.
function _ageDetail(a){
  var det = a.detail||'';
  var mj = det.match(/\((\d+)\s*jours?\)/);
  if(!mj) return null;
  var md = det.match(/(\d{2}\/\d{2}\/\d{4})/);
  return { days: parseInt(mj[1],10), date: md?md[1]:'' };
}
function _renderAlerte(a){
  var ai = _ageDetail(a);
  var chip = ai ? `<span class="age-chip">${esc(ai.date)} · ${ai.days} j</span>` : '';
  return `<div class="alerte${a.nouveau?' nouveau':''}">
    <div class="t"><span class="dot ${a.gravite}"></span>${esc(a.titre)}${a.nouveau?'<span class="badge-nouveau">NOUVEAU</span>':''}${chip}</div>
    <div class="d">${esc(a.detail||'')}</div>
    ${a.lien ? `<a href="${esc(a.lien)}" target="_blank" rel="noopener" class="conseil" style="display:block;text-decoration:none;color:#7FA88A;">🔗 Voir l'article dans MonLegiTexte →</a>` : ''}
    ${CONSEILS[a.categorie] ? `<div class="conseil">💡 ${esc(CONSEILS[a.categorie])}</div>` : ''}
  </div>`;
}
// Regroupe les alertes d'une section : nouveau d'abord (toujours ouvert), puis
// par ancienneté quand une date existe (>12 mois ouvert, le reste replié), enfin
// "déjà vu / sans date" replié — pour ne pas re-vérifier ce qui n'a pas bougé.
function _grouperAlertes(alertes, ordreGravite){
  var og = ordreGravite || {haute:0,moyenne:1,basse:2};
  var tri = function(arr){ return arr.sort(function(a,b){ return (og[a.gravite]??9)-(og[b.gravite]??9); }); };
  var nouv=[], v12=[], v3=[], frais=[], sansdate=[];
  (alertes||[]).forEach(function(a){
    if(a.nouveau){ nouv.push(a); return; }
    var ai=_ageDetail(a);
    if(!ai) sansdate.push(a);
    else if(ai.days>=365) v12.push(a);
    else if(ai.days>=90) v3.push(a);
    else frais.push(a);
  });
  var g=[];
  if(nouv.length) g.push({cle:'nouveau', label:'🆕 Nouveau depuis le dernier passage', ouvert:true, alertes:tri(nouv)});
  if(v12.length) g.push({cle:'v12', label:'⏳ Plus de 12 mois — à revérifier', ouvert:true, alertes:tri(v12)});
  if(v3.length) g.push({cle:'v3', label:'📅 De 3 à 12 mois — signal précoce', ouvert:false, alertes:tri(v3)});
  if(frais.length) g.push({cle:'frais', label:'🕐 Moins de 3 mois — récent', ouvert:false, alertes:tri(frais)});
  if(sansdate.length) g.push({cle:'sansdate', label:'Déjà vu — inchangé depuis le dernier passage', ouvert:false, alertes:tri(sansdate)});
  return g;
}
// Déplier/replier un sous-groupe change la hauteur : on recalcule la hauteur de
// la section ouverte pour ne rien couper (l'événement 'toggle' ne bouillonne pas).
document.getElementById('sections').addEventListener('toggle', function(e){
  if(e.target && e.target.classList && e.target.classList.contains('grp')){
    var sec = e.target.closest('.section.open');
    if(sec){ var corps = sec.querySelector('.corps'); if(corps) corps.style.maxHeight = corps.scrollHeight + 'px'; }
  }
}, true);

// Export texte : une liste de contrôle à cocher, groupée comme à l'écran
// (Nouveau / >12 mois / 3-12 mois / …). Plus simple pour pointer les contrôles.
function exporterTexte(){
  var d = window.__DONNEES;
  if(!d){ alert('Données non encore chargées, réessaie dans un instant.'); return; }
  function p2(n){ return (n<10?'0':'')+n; }
  function fmtDate(x){ if(!x) return '—'; var t=new Date(x); if(isNaN(t)) return String(x);
    return p2(t.getDate())+'/'+p2(t.getMonth()+1)+'/'+t.getFullYear()+' '+p2(t.getHours())+':'+p2(t.getMinutes()); }
  var now = new Date();
  var toutes = d.sections.reduce(function(n,s){ return n+((s.alertes||[]).length); }, 0);
  var nouv = 0; d.sections.forEach(function(s){ (s.alertes||[]).forEach(function(a){ if(a.nouveau) nouv++; }); });
  var L = [];
  L.push('VEILLE PERSO — LISTE DE CONTRÔLE');
  L.push('Généré le : '+fmtDate(d.genere));
  L.push('Total : '+toutes+' alerte(s) · '+nouv+' nouvelle(s) depuis le dernier passage');
  L.push('Exporté le : '+fmtDate(now));
  L.push('Astuce : remplace [ ] par [x] au fur et à mesure des contrôles.');
  L.push(''.padEnd(60,'='));
  L.push('');
  d.sections.forEach(function(s){
    var al = s.alertes||[]; if(!al.length) return;
    L.push('########## '+String(s.titre||s.id||'?').toUpperCase()+' ('+al.length+') ##########');
    L.push('');
    _grouperAlertes(al).forEach(function(g){
      L.push('--- '+g.label+' ('+g.alertes.length+') ---');
      g.alertes.forEach(function(a){
        L.push('[ ] ('+(a.gravite||'?')+') '+String(a.titre||'').trim());
        if(a.detail) L.push('      '+String(a.detail).replace(/\s+/g,' ').trim());
      });
      L.push('');
    });
  });
  if(toutes===0) L.push('Aucune alerte : rien à contrôler. ✓');
  var blob = new Blob([L.join('\n')], {type:'text/plain;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'veille-controle-'+now.getFullYear()+p2(now.getMonth()+1)+p2(now.getDate())+'.txt';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ try{ document.body.removeChild(a); }catch(e){} URL.revokeObjectURL(url); }, 200);
}
async function charger(){
  let d;
  try{
    const r = await fetch('donnees.json', {cache:'no-cache'});
    d = await r.json();
    window.__DONNEES = d;
  }catch(e){
    document.getElementById('hdrSub').textContent = 'Données indisponibles hors-ligne.';
    return;
  }

  const toutes = d.sections.flatMap(s => s.alertes || []);
  const compte = {haute:0, moyenne:0, basse:0};
  toutes.forEach(a => { if(compte[a.gravite]!=null) compte[a.gravite]++; });

  const genere = new Date(d.genere);
  document.getElementById('hdrSub').textContent =
    'Généré le ' + genere.toLocaleDateString('fr-FR') + ' à ' +
    genere.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

  document.getElementById('resume').innerHTML =
    (d.nouvelles_alertes>0 ? `<div class="pill nouveau"><b>${d.nouvelles_alertes}</b><span>nouveau</span></div>` : '') +
    ['haute','moyenne','basse'].map(g =>
    `<div class="pill ${g}"><b>${compte[g]}</b><span>${g}</span></div>`
  ).join('');

  const ordreGravite = {haute:0, moyenne:1, basse:2};

  document.getElementById('sections').innerHTML = d.sections.map((s, i) => {
    if(s.non_construit){
      return `<div class="section">
        <div class="section-hd"><div><div class="titre">${esc(LIB[s.id]||s.titre)}</div>
        <div class="compte">Pas encore de détection automatique</div></div></div>
        <div class="non-construit">Section prête, en attente du nom du dépôt pour la brancher.</div>
      </div>`;
    }
    const groupes = _grouperAlertes(s.alertes||[], ordreGravite);
    const n = (s.alertes||[]).length;
    return `<div class="section${n>0?'':''}" id="sec-${i}">
      <div class="section-hd" onclick="toggleSection(${i})">
        <div><div class="titre">${esc(LIB[s.id]||s.titre)}</div>
        <div class="compte">${n} alerte${n>1?'s':''}</div></div>
        <div style="display:flex;align-items:center">
          <span class="badge ${n>0?'non-zero':'zero'}">${n>0?n:'✓'}</span>
          <span class="chev">›</span>
        </div>
      </div>
      <div class="corps">
        ${n===0 ? '<div class="vide">Rien à signaler.</div>'
          : groupes.map(g => `<details class="grp g-${g.cle}"${g.ouvert?' open':''}>
              <summary><span class="gl">${g.label}</span><span class="grp-n">${g.alertes.length}</span></summary>
              <div class="grp-body">${g.alertes.map(_renderAlerte).join('')}</div>
            </details>`).join('')}
      </div>
    </div>`;
  }).join('');

  // La section la plus grave s'ouvre par défaut, pour ne pas cliquer à l'aveugle --
  // et toute section contenant du nouveau s'ouvre aussi : c'est justement ce qu'on
  // veut voir en premier, pas seulement ce qui est grave depuis longtemps.
  const pireIdx = d.sections.findIndex(s => (s.alertes||[]).some(a=>a.gravite==='haute'));
  const aOuvrir = pireIdx>=0 ? pireIdx : d.sections.findIndex(s=>(s.alertes||[]).length>0);
  if(aOuvrir>=0) ouvrirSection(aOuvrir);
  d.sections.forEach((s,i)=>{
    if((s.alertes||[]).some(a=>a.nouveau)) ouvrirSection(i);
  });

  document.getElementById('pied').textContent = toutes.length===0
    ? 'Aucune alerte, tout est à jour.'
    : toutes.length + ' alerte(s) au total sur ' + d.sections.length + ' catégories.';
}

// Hauteur calculée dynamiquement (scrollHeight), jamais un plafond fixe --
// un plafond en dur a déjà coupé une section à 12 alertes visibles sur 120
// réelles, l'ajout du texte de conseil sous chaque alerte ayant fait
// dépasser l'ancien plafond de 2000px. Ça ne doit plus jamais dépendre d'un
// nombre choisi à l'avance : ça s'adapte au contenu réel, quelle que soit sa
// taille future.
function ouvrirSection(i){
  const sec = document.getElementById('sec-'+i);
  if(!sec) return;
  sec.classList.add('open');
  const corps = sec.querySelector('.corps');
  corps.style.maxHeight = corps.scrollHeight + 'px';
}
function fermerSection(i){
  const sec = document.getElementById('sec-'+i);
  if(!sec) return;
  sec.classList.remove('open');
  sec.querySelector('.corps').style.maxHeight = '0px';
}
function toggleSection(i){
  const sec = document.getElementById('sec-'+i);
  if(!sec) return;
  if(sec.classList.contains('open')) fermerSection(i); else ouvrirSection(i);
}

// Historique : une vue séparée, plus simple que la vue courante (pas de
// plier/déplier par section) -- consulter un instantané passé est un besoin
// de référence ponctuelle, pas une interaction quotidienne.
let historiqueCharge = false;

function basculerHistorique(){
  const enHistorique = document.getElementById('vueHistorique').style.display !== 'none';
  document.getElementById('vueHistorique').style.display = enHistorique ? 'none' : 'block';
  document.getElementById('resume').style.display = enHistorique ? 'flex' : 'none';
  document.getElementById('sections').style.display = enHistorique ? 'block' : 'none';
  document.getElementById('vueReglesCCN').style.display = 'none';
  document.getElementById('btnReglesCCN').textContent = '📋 Règles CCN';
  document.getElementById('btnHistorique').textContent = enHistorique ? '📜 Historique' : '← Retour au run actuel';
  if(!enHistorique && !historiqueCharge){
    historiqueCharge = true;
    chargerListeHistorique();
  }
}

async function chargerListeHistorique(){
  const conteneur = document.getElementById('listeHistorique');
  let index;
  try{
    const r = await fetch('historique/index.json', {cache:'no-cache'});
    index = await r.json();
  }catch(e){
    conteneur.innerHTML = '<div class="vide">Aucun historique disponible pour l\'instant -- il se remplit à chaque run.</div>';
    return;
  }
  index = index.slice().reverse(); // le plus récent en premier
  conteneur.innerHTML = index.map((run, i) => {
    const dt = new Date(run.genere);
    const date = dt.toLocaleDateString('fr-FR') + ' à ' + dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    return `<div class="alerte" style="cursor:pointer" onclick="afficherDetailHistorique('${run.fichier}')">
      <div class="t">${date}
        ${run.nouvelles_alertes>0 ? `<span class="badge-nouveau">${run.nouvelles_alertes} NOUVEAU</span>` : ''}
      </div>
      <div class="d">${run.total} alerte(s) — ${run.par_gravite.haute} haute, ${run.par_gravite.moyenne} moyenne, ${run.par_gravite.basse} basse</div>
    </div>`;
  }).join('') || '<div class="vide">Aucun run enregistré pour l\'instant.</div>';
}

async function afficherDetailHistorique(fichier){
  const conteneur = document.getElementById('detailHistorique');
  conteneur.innerHTML = '<div class="vide">Chargement…</div>';
  let d;
  try{
    const r = await fetch('historique/' + fichier, {cache:'no-cache'});
    d = await r.json();
  }catch(e){
    conteneur.innerHTML = '<div class="vide">Impossible de charger cet instantané.</div>';
    return;
  }
  const dt = new Date(d.genere);
  const date = dt.toLocaleDateString('fr-FR') + ' à ' + dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  conteneur.innerHTML = `<div style="margin:14px 0 6px;font-size:13px;color:var(--txt2)">
      Instantané du ${date} — <span onclick="document.getElementById('detailHistorique').innerHTML=''" style="text-decoration:underline;cursor:pointer">fermer</span>
    </div>` +
    d.sections.map(s => {
      const alertes = s.alertes || [];
      if(!alertes.length) return '';
      return `<div class="section open"><div class="section-hd" style="cursor:default">
          <div><div class="titre">${esc(LIB[s.id]||s.titre)}</div><div class="compte">${alertes.length} alerte(s)</div></div>
        </div><div class="corps" style="max-height:none">
          ${alertes.map(a => `<div class="alerte">
            <div class="t"><span class="dot ${a.gravite}"></span>${esc(a.titre)}</div>
            <div class="d">${esc(a.detail||'')}</div>
          </div>`).join('')}
        </div></div>`;
    }).join('');
}

// Règles CCN : consultation, pas des alertes -- pas de plier/déplier, une
// recherche et une liste, comme l'historique.
let reglesCCN = null;

function basculerReglesCCN(){
  const vue = document.getElementById('vueReglesCCN');
  const enVue = vue.style.display !== 'none';
  vue.style.display = enVue ? 'none' : 'block';
  document.getElementById('resume').style.display = enVue ? 'flex' : 'none';
  document.getElementById('sections').style.display = enVue ? 'block' : 'none';
  document.getElementById('vueHistorique').style.display = 'none';
  document.getElementById('btnHistorique').textContent = '📜 Historique';
  document.getElementById('btnReglesCCN').textContent = enVue ? '📋 Règles CCN' : '← Retour au run actuel';
  if(!enVue && !reglesCCN){
    chargerReglesCCN();
  }
}

async function chargerReglesCCN(){
  const conteneur = document.getElementById('listeReglesCCN');
  try{
    const r = await fetch('ccn-regles.json', {cache:'no-cache'});
    const d = await r.json();
    reglesCCN = d.entrees;
    document.getElementById('compteurReglesCCN').textContent =
      `${d.entrees.length} conventions — source app v${d.versionSource}`;
    filtrerReglesCCN();
    document.getElementById('rechercheCCN').focus();
  }catch(e){
    conteneur.innerHTML = '<div class="vide">Données indisponibles pour l\'instant.</div>';
  }
}

function ligneTaux(e){
  let s = `${e.taux1}% (à partir de la ${e.palier1}e h)`;
  if(e.taux_inter != null) s += ` → ${e.taux_inter}% (à partir de la ${e.palier_inter}e h)`;
  s += ` → ${e.taux2}%`;
  return s;
}

function filtrerReglesCCN(){
  if(!reglesCCN) return;
  const q = document.getElementById('rechercheCCN').value.trim().toLowerCase();
  let resultats = reglesCCN;
  if(q){
    resultats = reglesCCN.filter(e =>
      String(e.idcc).includes(q) ||
      (e.nom||'').toLowerCase().includes(q) ||
      (e.secteur||'').toLowerCase().includes(q));
  }
  const conteneur = document.getElementById('listeReglesCCN');
  const AFFICHES = resultats.slice(0, 40);
  conteneur.innerHTML = AFFICHES.map(e => `
    <div class="alerte">
      <div class="t">${esc(e.nom)} <span style="color:var(--txt2);font-weight:400">— IDCC ${e.idcc}</span></div>
      <div class="d">
        Majoration HS : ${esc(ligneTaux(e))}<br>
        Contingent annuel : ${e.contingent}h · Seuil : ${e.seuil}h/sem
        ${e.notes ? `<div class="conseil">📖 ${esc(e.notes)}</div>` : ''}
      </div>
    </div>`).join('') || '<div class="vide">Aucune convention ne correspond.</div>';
  if(resultats.length > AFFICHES.length){
    conteneur.innerHTML += `<div class="vide">… et ${resultats.length - AFFICHES.length} de plus — précise la recherche.</div>`;
  }
}

charger();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// Code d'accès -- une barrière simple, pas une vraie sécurité. Tout se passe
// côté navigateur : quiconque ouvre le code source ou lit sw.js/donnees.json
// directement peut la contourner. Ça arrête un visiteur qui tombe dessus par
// hasard, pas quelqu'un qui cible délibérément cette page. Pour une vraie
// protection, il faudrait un mot de passe côté serveur (Cloudflare Access,
// par exemple) -- pas construit ici.
(function(){
  const CODE = '19871502';
  const CLE_LOCAL = 'veille_deverrouille';
  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  const champ = document.getElementById('gateCode');
  const erreur = document.getElementById('gateErr');

  function ouvrir(){
    gate.style.display = 'none';
    app.style.display = 'block';
  }

  if(localStorage.getItem(CLE_LOCAL) === '1'){
    ouvrir();
  } else {
    app.style.display = 'none';
    champ.focus();
    champ.addEventListener('input', () => {
      if(champ.value.length < CODE.length) { erreur.textContent = ''; return; }
      if(champ.value === CODE){
        try{ localStorage.setItem(CLE_LOCAL, '1'); }catch(e){}
        ouvrir();
      } else {
        erreur.textContent = 'Code incorrect';
        champ.value = '';
      }
    });
  }
})();
</script>
