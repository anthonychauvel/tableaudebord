<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Veille — tableau de bord</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0D1116">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --ink:#0A0D11; --ink2:#12161B; --ink3:#1B2027; --edge:#2E3742;
  --gold:#f0c040; --txt:#E8EDF2; --txt2:#8A97A5;
  --haute:#e05c5c; --moyenne:#e0a95c; --basse:#6b7684;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(1100px 620px at 12% -8%, rgba(120,150,190,.16), transparent 60%),
    radial-gradient(900px 520px at 88% 108%, rgba(190,150,110,.10), transparent 62%),
    linear-gradient(168deg, #14181D 0%, #0D1116 46%, #0A0D11 100%);
  color:var(--txt);
  min-height:100vh; padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
.hdr{padding:calc(16px + env(safe-area-inset-top)) 18px 10px;}
.hdr h1{font-size:19px;font-weight:800;}
.hdr .sub{font-size:12px;color:var(--txt2);margin-top:2px;}
.resume{display:flex;gap:10px;padding:4px 18px 14px;overflow-x:auto;}
.resume .pill{flex-shrink:0;background:var(--ink3);border:1px solid var(--edge);
  border-radius:12px;padding:8px 13px;text-align:center;min-width:64px;}
.resume .pill b{display:block;font-size:18px;}
.resume .pill span{font-size:9.5px;color:var(--txt2);text-transform:uppercase;letter-spacing:.4px;}
.resume .pill.haute b{color:var(--haute);}
.resume .pill.moyenne b{color:var(--moyenne);}
.resume .pill.basse b{color:var(--basse);}
.resume .pill.nouveau{border-color:var(--haute);}
.resume .pill.nouveau b{color:var(--haute);}

.section{margin:0 14px 12px;background:linear-gradient(160deg,#1B2027,#12161B);
  border:1px solid var(--edge);border-radius:16px;overflow:hidden;}
.section-hd{display:flex;align-items:center;justify-content:space-between;
  padding:13px 15px;cursor:pointer;}
.section-hd .titre{font-size:14.5px;font-weight:700;}
.section-hd .compte{font-size:11px;color:var(--txt2);margin-top:1px;}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;flex-shrink:0;}
.badge.zero{background:rgba(255,255,255,.05);color:var(--txt2);}
.badge.non-zero{background:rgba(224,92,92,.15);color:var(--haute);}
.chev{transition:transform .2s;color:var(--txt2);margin-left:8px;}
.section.open .chev{transform:rotate(90deg);}
.corps{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.section.open .corps{max-height:2000px;}
.alerte{padding:11px 15px;border-top:1px solid var(--edge);}
.alerte.nouveau{border-left:3px solid var(--haute);background:rgba(224,92,92,0.06);}
.alerte .badge-nouveau{display:inline-block;background:var(--haute);color:#fff;font-size:9px;
  font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;letter-spacing:.3px;vertical-align:middle;}
.alerte .t{font-size:13px;font-weight:600;line-height:1.35;display:flex;gap:7px;align-items:flex-start;}
.alerte .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.alerte .dot.haute{background:var(--haute);}
.alerte .dot.moyenne{background:var(--moyenne);}
.alerte .dot.basse{background:var(--basse);}
.alerte .d{font-size:11.5px;color:var(--txt2);margin-top:3px;margin-left:14px;line-height:1.5;}
.vide{padding:16px 15px;font-size:12.5px;color:var(--txt2);text-align:center;}
.non-construit{padding:14px 15px;font-size:12px;color:var(--txt2);text-align:center;
  border-top:1px dashed var(--edge);}
.pied{padding:16px 18px 4px;font-size:10.5px;color:var(--txt2);text-align:center;}
</style>
</head>
<body>

<div id="gate" style="position:fixed;inset:0;z-index:999;background:#0A0D11;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <div style="font-size:34px;margin-bottom:14px;">🔒</div>
  <div style="color:#8A97A5;font-size:13px;margin-bottom:18px;">Code d'accès</div>
  <input id="gateCode" type="tel" inputmode="numeric" autocomplete="off" maxlength="12"
    style="background:#1B2027;border:1px solid #2E3742;border-radius:12px;color:#E8EDF2;
    font-size:20px;letter-spacing:4px;text-align:center;padding:14px 18px;width:220px;">
  <div id="gateErr" style="color:#e05c5c;font-size:12px;margin-top:10px;height:16px;"></div>
</div>

<div id="app" style="display:none;">

<div class="hdr">
  <h1>🔎 Veille perso</h1>
  <div class="sub" id="hdrSub">Chargement…</div>
</div>

<div class="resume" id="resume"></div>
<div id="sections"></div>
<div class="pied" id="pied"></div>

</div><!-- #app -->

<script>
const LIB = {grilles:'Grilles CCN', droit:'MonLegiTexte', modules:'8 modules',
             outils:'105 outils', guide:'Guide SEO', citations:'Citations juridiques',
             syntaxe:'Syntaxe JS', structure:'Structure', noindex:'MonLegiTexte (direct)'};

function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function charger(){
  let d;
  try{
    const r = await fetch('donnees.json', {cache:'no-cache'});
    d = await r.json();
  }catch(e){
    document.getElementById('hdrSub').textContent = 'Données indisponibles hors-ligne.';
    return;
  }

  const toutes = d.sections.flatMap(s => s.alertes || []);
  const compte = {haute:0, moyenne:0, basse:0};
  toutes.forEach(a => { if(compte[a.gravite]!=null) compte[a.gravite]++; });

  const genere = new Date(d.genere);
  document.getElementById('hdrSub').textContent =
    'Généré le ' + genere.toLocaleDateString('fr-FR') + ' à ' +
    genere.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

  document.getElementById('resume').innerHTML =
    (d.nouvelles_alertes>0 ? `<div class="pill nouveau"><b>${d.nouvelles_alertes}</b><span>nouveau</span></div>` : '') +
    ['haute','moyenne','basse'].map(g =>
    `<div class="pill ${g}"><b>${compte[g]}</b><span>${g}</span></div>`
  ).join('');

  const ordreGravite = {haute:0, moyenne:1, basse:2};

  document.getElementById('sections').innerHTML = d.sections.map((s, i) => {
    if(s.non_construit){
      return `<div class="section">
        <div class="section-hd"><div><div class="titre">${esc(LIB[s.id]||s.titre)}</div>
        <div class="compte">Pas encore de détection automatique</div></div></div>
        <div class="non-construit">Section prête, en attente du nom du dépôt pour la brancher.</div>
      </div>`;
    }
    const alertes = (s.alertes||[]).slice().sort((a,b)=>
      (b.nouveau?1:0)-(a.nouveau?1:0) || (ordreGravite[a.gravite]??9)-(ordreGravite[b.gravite]??9));
    const n = alertes.length;
    return `<div class="section${n>0?'':''}" id="sec-${i}">
      <div class="section-hd" onclick="document.getElementById('sec-${i}').classList.toggle('open')">
        <div><div class="titre">${esc(LIB[s.id]||s.titre)}</div>
        <div class="compte">${n} alerte${n>1?'s':''}</div></div>
        <div style="display:flex;align-items:center">
          <span class="badge ${n>0?'non-zero':'zero'}">${n>0?n:'✓'}</span>
          <span class="chev">›</span>
        </div>
      </div>
      <div class="corps">
        ${n===0 ? '<div class="vide">Rien à signaler.</div>' : alertes.map(a => `
          <div class="alerte${a.nouveau?' nouveau':''}">
            <div class="t"><span class="dot ${a.gravite}"></span>${esc(a.titre)}${a.nouveau?'<span class="badge-nouveau">NOUVEAU</span>':''}</div>
            <div class="d">${esc(a.detail||'')}</div>
          </div>`).join('')}
      </div>
    </div>`;
  }).join('');

  // La section la plus grave s'ouvre par défaut, pour ne pas cliquer à l'aveugle --
  // et toute section contenant du nouveau s'ouvre aussi : c'est justement ce qu'on
  // veut voir en premier, pas seulement ce qui est grave depuis longtemps.
  const pireIdx = d.sections.findIndex(s => (s.alertes||[]).some(a=>a.gravite==='haute'));
  const aOuvrir = pireIdx>=0 ? pireIdx : d.sections.findIndex(s=>(s.alertes||[]).length>0);
  if(aOuvrir>=0){ const el=document.getElementById('sec-'+aOuvrir); if(el) el.classList.add('open'); }
  d.sections.forEach((s,i)=>{
    if((s.alertes||[]).some(a=>a.nouveau)){ const el=document.getElementById('sec-'+i); if(el) el.classList.add('open'); }
  });

  document.getElementById('pied').textContent = toutes.length===0
    ? 'Aucune alerte, tout est à jour.'
    : toutes.length + ' alerte(s) au total sur ' + d.sections.length + ' catégories.';
}

charger();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// Code d'accès -- une barrière simple, pas une vraie sécurité. Tout se passe
// côté navigateur : quiconque ouvre le code source ou lit sw.js/donnees.json
// directement peut la contourner. Ça arrête un visiteur qui tombe dessus par
// hasard, pas quelqu'un qui cible délibérément cette page. Pour une vraie
// protection, il faudrait un mot de passe côté serveur (Cloudflare Access,
// par exemple) -- pas construit ici.
(function(){
  const CODE = '19871502';
  const CLE_LOCAL = 'veille_deverrouille';
  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  const champ = document.getElementById('gateCode');
  const erreur = document.getElementById('gateErr');

  function ouvrir(){
    gate.style.display = 'none';
    app.style.display = 'block';
  }

  if(localStorage.getItem(CLE_LOCAL) === '1'){
    ouvrir();
  } else {
    app.style.display = 'none';
    champ.focus();
    champ.addEventListener('input', () => {
      if(champ.value.length < CODE.length) { erreur.textContent = ''; return; }
      if(champ.value === CODE){
        try{ localStorage.setItem(CLE_LOCAL, '1'); }catch(e){}
        ouvrir();
      } else {
        erreur.textContent = 'Code incorrect';
        champ.value = '';
      }
    });
  }
})();
</script>
</body>
</html>
