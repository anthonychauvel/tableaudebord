<style>
:root{--ink:#0B0E12;--ink2:#11151A;--ink3:#171C22;--edge:#262E38;--txt:#E6EBF0;--txt2:#8994A1;--accent:#6EA8FE;--haute:#ff6b6b;--moyenne:#ffb454;--ok:#4cd585;--vio:#b49cff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#0A0D11}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--ink);color:var(--txt);min-height:100vh;padding:calc(14px + env(safe-area-inset-top)) 14px calc(90px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto}
h1{font-size:20px;font-weight:800;margin:4px 2px 2px}h1 small{display:block;font-size:12px;color:var(--txt2);font-weight:600;margin-top:3px}
a.back{color:var(--accent);font-size:13px;text-decoration:none;font-weight:650}
.c{background:linear-gradient(160deg,#1C222A,#13171D);border:1px solid var(--edge);border-radius:18px;padding:14px;margin:12px 0}
.c h2{font-size:11px;font-weight:750;letter-spacing:1.1px;text-transform:uppercase;color:var(--txt2);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.c h2 small{letter-spacing:0;text-transform:none;font-weight:650}
label{display:block;font-size:12px;color:var(--txt2);margin:10px 0 4px;font-weight:650}
input,select,textarea{width:100%;background:var(--ink2);border:1px solid var(--edge);border-radius:12px;color:var(--txt);font:16px -apple-system,system-ui,sans-serif;padding:11px 12px;-webkit-appearance:none;appearance:none}
input[type=date]{min-height:46px}
textarea{min-height:60px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row>*{flex:1 1 0;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
button{border:0;border-radius:12px;padding:11px 14px;font:700 14px -apple-system,system-ui,sans-serif;color:#0B0E12;background:var(--accent);cursor:pointer}
button.sec{background:#232a33;color:var(--txt)}button.dang{background:var(--haute);color:#fff}button.ok{background:var(--ok)}button.sm{padding:7px 10px;font-size:12px}
.msg{font-size:13px;line-height:1.45;color:var(--txt2)}.msg b{color:var(--txt)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--ink2);border:1px solid var(--edge);border-radius:14px;padding:11px 12px}
.kpi small{display:block;font-size:11px;color:var(--txt2);font-weight:650}.kpi b{display:block;font-size:20px;margin-top:3px;font-variant-numeric:tabular-nums}.kpi i{display:block;font-style:normal;font-size:11px;color:var(--txt2);margin-top:2px}

.tag.ok{background:rgba(76,213,133,.15);color:var(--ok)}.tag.w{background:rgba(255,180,84,.18);color:var(--moyenne)}.tag.d{background:rgba(255,107,107,.18);color:var(--haute)}.tag.v{background:rgba(180,156,255,.16);color:var(--vio)}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chips span{font-size:12px;background:#232a33;border-radius:99px;padding:4px 9px}

<body>
<div class="top"><div><a class="back" href="index.html">‹ Tableau de bord</a>
<h1>💼 Celmar Apps<small id="sub">Micro-entreprise · recettes, frais, affiliations, échéances</small></h1>
<div class="sync" id="sync"></div></div>
<select class="yr" id="yr" onchange="Y=+this.value;draw()" aria-label="Année"></select></div>
<main id="main"></main>
<nav class="tabs"><div id="tabs"></div></nav>

<script>
/* ═══════════════════════════════════════════════════════════════════
   Celmar Apps — tableau de bord de la micro-entreprise (perso).
   Données : sur ce téléphone + coffre chiffré sur le serveur Vezoria
   (/api/admin, actions vaultGet/vaultPut). Le chiffrement AES-256-GCM
   se fait ICI avec une clé tirée de la clé d'administration : le serveur
   ne garde qu'un bloc illisible.
   Les taux (cotisations, versement libératoire, plafonds) sont réglables :
   à vérifier chaque janvier sur autoentrepreneur.urssaf.fr.
═══════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const LS = {get:k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}}, set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};
const esc = t => String(t==null?'':t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',', '.')); return isFinite(n) ? n : 0; };
const eur = n => (Math.round(n*100)/100).toLocaleString('fr-FR', {minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits:2}) + ' €';
const today = () => new Date().toISOString().slice(0,10);
const fd = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'}) : '';
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0,10); };
const daysTo = d => Math.round((new Date(d + 'T12:00:00') - new Date(today() + 'T12:00:00')) / 864e5);
const lastDay = (y, m) => new Date(Date.UTC(y, m, 0)).toISOString().slice(0,10);   // m = 1..12

const DEF = {start:'2026-11-01', per:'T', vl:true, rs:21.2, cfp:0.1, rvl:1.7, plafond:83600, tva:37500, nom:'Celmar Apps', siret:'', apps:'Vezoria, SimulHeures, MonLegiTexte, Escale'};
const SRC = ['Booking.com','GetYourGuide','Travelpayouts','Awin','Google AdSense','Buy Me a Coffee','Google Play','Autre'];
const MODES = ['Virement','PayPal','Stripe','Carte','Espèces','Autre'];
const CATS = [['serv','🖥️','Serveur / hébergement'],['dom','🌐','Nom de domaine'],['store','📱','Store (Google, Apple)'],['logi','🧩','Logiciel / abonnement'],['mat','💻','Matériel'],['pub','📣','Publicité / promo'],['form','🎓','Formation'],['banq','🏦','Banque'],['autre','📦','Autre']];
const AST = [['todo','À demander','w'],['wait','En attente','v'],['ok','Validé','ok'],['no','Refusé','d'],['stop','Arrêté','']];

/* ── état ── */
let S = load(), Y = new Date().getFullYear(), TAB = LS.get('mc_tab') || 'home';
function blank(){ return {v:1, rec:[], dep:[], aff:[], dl:[], done:{}, set:Object.assign({at:0}, DEF)}; }
function load(){ try { const j = JSON.parse(LS.get('mc_data') || 'null'); if(j && j.v) return Object.assign(blank(), j, {set:Object.assign({}, DEF, j.set || {})}); } catch(e){} return blank(); }
const live = a => (a || []).filter(x=>!x.del);
const setv = () => S.set;
function persist(){ LS.set('mc_data', JSON.stringify(S)); }
function touch(){ persist(); draw(); push(); }
function upsert(list, o){ o.at = Date.now(); const i = S[list].findIndex(x=>x.id === o.id); if(i >= 0) S[list][i] = o; else S[list].push(o); touch(); }
function drop(list, id){ const x = S[list].find(x=>x.id === id); if(x){ x.del = true; x.at = Date.now(); touch(); } }

/* ── calculs ── */
const inY = (d, y) => d && +d.slice(0,4) === y;
const recY = y => live(S.rec).filter(r=>r.st !== 'att' && inY(r.date, y));
const depY = y => live(S.dep).filter(r=>inY(r.date, y));
const sum = a => a.reduce((s, x)=>s + num(x.amt), 0);
const rate = () => { const s = setv(); return (num(s.rs) + num(s.cfp) + (s.vl ? num(s.rvl) : 0)) / 100; };
// périodes de déclaration URSSAF (la 1ʳᵉ couvre le début d'activité jusqu'à la fin du trimestre — ou du mois — où tombent les 90 premiers jours)
function periods(){
  const s = setv(), st = s.start || DEF.start, out = [], T = s.per !== 'M';
  const p90 = addDays(st, 90); let y = +p90.slice(0,4), m = +p90.slice(5,7);
  if(T) m = Math.ceil(m / 3) * 3;
  let from = st;
  for(let i = 0; i < 40; i++){
    const to = lastDay(y, m); let dy = y, dm = m + 1; if(dm > 12){ dm = 1; dy++; }
    out.push({k:'u:' + to, from, to, due:lastDay(dy, dm), first:i === 0});   // à déclarer avant la fin du mois qui suit la période
    from = addDays(to, 1); m += T ? 3 : 1; if(m > 12){ m -= 12; y++; }
    if(from > addDays(today(), 400)) break;
  }
  return out;
}
const caIn = (a, b) => live(S.rec).filter(r=>r.st !== 'att' && r.date >= a && r.date <= b).reduce((s, r)=>s + num(r.amt), 0);
function autoDl(){
  const s = setv(), y0 = +(s.start || DEF.start).slice(0,4), L = [];
  periods().forEach(p=>{ const ca = caIn(p.from, p.to);
    L.push({id:p.k, auto:1, date:p.due, ic:'🧾', title:`Déclarer le CA à l'URSSAF${p.first ? ' (1ʳᵉ déclaration)' : ''}`,
      note:`Période du ${fd(p.from)} au ${fd(p.to)} · CA encaissé : ${eur(ca)} · à payer ≈ ${eur(ca * rate())}${ca ? '' : ' — déclarer 0 € quand même'}`, url:'https://autoentrepreneur.urssaf.fr'}); });
  for(let y = y0 + 1; y <= new Date().getFullYear() + 1; y++){
    const ca = recY(y - 1).reduce((s, r)=>s + num(r.amt), 0);
    L.push({id:'ir:' + y, auto:1, date:`${y}-05-25`, ic:'🏛️', title:`Reporter le CA ${y - 1} sur la déclaration de revenus`, note:`Déclaration 2042-C-PRO, rubrique micro-entrepreneur${s.vl ? ' (versement libératoire : déjà payé, c’est pour le calcul du revenu fiscal)' : ''} · CA ${y - 1} : ${eur(ca)} · date exacte selon ton département`, url:'https://www.impots.gouv.fr'});
    if(y >= y0 + 1) L.push({id:'cfe:' + y, auto:1, date:`${y}-12-15`, ic:'🏢', title:`CFE ${y} (cotisation foncière)`, note:`${y === y0 + 1 ? 'Exonérée l’année de création ; ' : ''}exonérée aussi si le CA de l’année N-2 est sous 5 000 €. L’avis arrive dans l’espace professionnel impots.gouv en novembre.`, url:'https://www.impots.gouv.fr/professionnel'});
  }
  L.push({id:'cfeinit', auto:1, date:`${y0}-12-31`, ic:'🏢', title:'Déclaration initiale de CFE (1447-C-SD)', note:'À vérifier dans ton espace professionnel impots.gouv : à déposer l’année de création pour bénéficier de l’exonération.', url:'https://www.impots.gouv.fr/professionnel'});
  return L;
}
const START = [['siret','🔢','Recevoir le SIREN/SIRET (mail INSEE)'],['urssaf','🧾','Créer l’espace autoentrepreneur.urssaf.fr'],['pro','🏛️','Créer l’espace professionnel impots.gouv'],['ml','⚖️','Mettre le nom « Celmar Apps », le SIRET et l’adresse dans les mentions légales des applis'],['aff','🤝','Inscrire les programmes d’affiliation avec le SIRET'],['play','📱','Passer le compte Google Play en « professionnel » si demandé'],['banq','🏦','Compte bancaire dédié (obligatoire si CA > 10 000 € deux ans de suite)']];
const isDone = k => !!(S.done[k] && S.done[k].v);
function allDl(){ return [...autoDl(), ...live(S.dl).map(d=>Object.assign({ic:'📌'}, d))].sort((a, b)=>(a.date || '9').localeCompare(b.date || '9')); }

/* ── chiffrement + synchro (coffre sur le serveur Vezoria) ── */
const b64 = u8 => { let s = ''; for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
let KEY = null, KEYK = '';
async function ckey(){ const k = LS.get('vz_admin_key'); if(!k) return null; if(KEY && KEYK === k) return KEY;
  const te = new TextEncoder(), base = await crypto.subtle.importKey('raw', te.encode(k), 'PBKDF2', false, ['deriveKey']);
  KEY = await crypto.subtle.deriveKey({name:'PBKDF2', salt:te.encode('celmar-micro/vault/v1'), iterations:200000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']); KEYK = k; return KEY; }
async function seal(o){ const k = await ckey(), iv = crypto.getRandomValues(new Uint8Array(12)); const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, new TextEncoder().encode(JSON.stringify(o)))); const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return b64(out); }
async function open_(s){ const k = await ckey(), u = unb64(s); return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:u.slice(0, 12)}, k, u.slice(12)))); }
async function api(body){
  const url = LS.get('vz_admin_url'), key = LS.get('vz_admin_key'); if(!url || !key) throw Object.assign(new Error('Synchro non réglée'), {cfg:1});
  const r = await fetch(url + '/api/admin', {method:'POST', headers:{'Content-Type':'application/json', 'X-Admin-Key':key}, body:JSON.stringify(body)});
  let j = {}; try { j = await r.json(); } catch(e){}
  if(r.status === 409) return Object.assign(j, {conflict:1});
  if(!r.ok) throw new Error(r.status === 403 ? 'clé refusée' : r.status === 404 ? 'ADMIN_KEY absente sur Cloudflare' : (j.error || 'erreur ' + r.status));
  return j;
}
function merge(a, b){   // fusion : chaque fiche garde sa version la plus récente (rien ne se perd entre deux appareils)
  const o = blank();
  ['rec','dep','aff','dl'].forEach(k=>{ const m = {}; [...(a[k] || []), ...(b[k] || [])].forEach(x=>{ if(!m[x.id] || (x.at || 0) > (m[x.id].at || 0)) m[x.id] = x; }); o[k] = Object.values(m); });
  const dn = Object.assign({}, a.done); Object.entries(b.done || {}).forEach(([k, v])=>{ if(!dn[k] || (v.at || 0) > (dn[k].at || 0)) dn[k] = v; }); o.done = dn;
  o.set = Object.assign({}, DEF, (a.set.at || 0) >= ((b.set || {}).at || 0) ? a.set : b.set);
  return o;
}
let BASE = +LS.get('mc_base') || 0, pushT = 0, busy = false, SY = {st:'', at:+LS.get('mc_synced') || 0};
function syncMsg(){ const e = $('sync'); if(!e) return; const has = LS.get('vz_admin_url') && LS.get('vz_admin_key');
  e.innerHTML = !has ? '📱 Sur ce téléphone seulement · <a href="#" onclick="tab(\'set\');return false" style="color:var(--accent)">activer la sauvegarde</a>'
    : SY.st === 'err' ? `<b class="d">⚠️ ${esc(SY.err)}</b> · gardé sur ce téléphone` : SY.st === 'busy' ? '<b class="w">⏳ synchro…</b>' : `<b>🔐 Sauvegardé chiffré</b>${SY.at ? ' · ' + new Date(SY.at).toLocaleString('fr-FR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : ''}`; }
function push(){ clearTimeout(pushT); pushT = setTimeout(sync, 1200); }
async function sync(){
  if(busy){ push(); return; } if(!(LS.get('vz_admin_url') && LS.get('vz_admin_key'))){ syncMsg(); return; }
  busy = true; SY.st = 'busy'; syncMsg();
  try {
    let g = await api({action:'vaultGet', k:'micro'});
    if(g.v && g.at !== BASE){ S = merge(S, await open_(g.v)); persist(); }
    BASE = g.at || 0;
    for(let i = 0; i < 3; i++){
      const r = await api({action:'vaultPut', k:'micro', v:await seal(S), base:BASE});
      if(!r.conflict){ BASE = r.at; break; }
      S = merge(S, await open_(r.v)); BASE = r.at;   // un autre appareil a écrit entre-temps : on fusionne et on renvoie
    }
    LS.set('mc_base', String(BASE)); persist(); SY = {st:'ok', at:Date.now()}; LS.set('mc_synced', String(SY.at));
  } catch(e){ SY = {st:'err', err:/decrypt|operation/i.test(e.name + e.message) ? 'coffre illisible avec cette clé' : e.message, at:SY.at}; }
  busy = false; syncMsg(); draw();
}

/* ── écrans ── */
const TABS = [['home','🏠','Accueil'],['rec','💶','Recettes'],['dep','🧾','Frais'],['aff','🤝','Affiliations'],['dl','⏰','Échéances'],['set','⚙️','Réglages']];
function tab(t){ TAB = t; LS.set('mc_tab', t); draw(); window.scrollTo(0, 0); }
function draw(){
  const ys = new Set([new Date().getFullYear(), +(setv().start || DEF.start).slice(0,4)]); [...S.rec, ...S.dep].forEach(x=>{ if(x.date) ys.add(+x.date.slice(0,4)); });
  $('yr').innerHTML = [...ys].sort((a, b)=>b - a).map(y=>`<option${y === Y ? ' selected' : ''}>${y}</option>`).join('');
  $('yr').style.visibility = ['home','rec','dep'].includes(TAB) ? '' : 'hidden';
  $('tabs').innerHTML = TABS.map(([k, ic, l])=>`<button class="${TAB === k ? 'on' : ''}" onclick="tab('${k}')"><span>${ic}</span>${l}</button>`).join('');
  $('main').innerHTML = ({home, rec:recV, dep:depV, aff:affV, dl:dlV, set:setV})[TAB]();
  syncMsg();
}
function nextDl(){ return allDl().filter(d=>!isDone(d.id) && d.date).find(d=>daysTo(d.date) >= -60); }
function dlBox(d){ if(!d) return `<div class="next ok"><b>✓ Aucune échéance en vue</b></div>`; const n = daysTo(d.date);
  return `<div class="next${n < 0 ? ' d' : n > 20 ? ' ok' : ''}" onclick="tab('dl')"><b>${d.ic} ${esc(d.title)}</b>${fd(d.date)} · ${n < 0 ? `<b style="display:inline;color:var(--haute)">en retard de ${-n} j</b>` : n === 0 ? 'aujourd’hui' : `dans ${n} j`}<br><small>${esc(d.note || '')}</small></div>`; }
function home(){
  const s = setv(), ca = sum(recY(Y)), fr = sum(depY(Y)), cot = ca * rate(), att = live(S.rec).filter(r=>r.st === 'att'), attT = sum(att);
  const pl = num(s.plafond) || 1, pct = Math.min(100, ca / pl * 100), tva = num(s.tva) || 1, ptva = ca / tva * 100;
  const pc = periods().find(p=>p.from <= today() && today() <= p.to) || periods()[0], caP = pc ? caIn(pc.from, pc.to) : 0;

  ${todo ? `<div class="c"><h2>Pour démarrer <small>${START.length - todo}/${START.length}</small></h2>${START.map(([k, ic, l])=>`<div class="it" onclick="tog('st:${k}')"><button class="ck${isDone('st:' + k) ? ' on' : ''}" aria-label="Fait">${isDone('st:' + k) ? '✓' : ''}</button><div class="t" style="white-space:normal"><b style="white-space:normal;${isDone('st:' + k) ? 'opacity:.5;text-decoration:line-through' : ''}">${ic} ${l}</b></div></div>`).join('')}</div>` : ''}
  <div class="row"><button onclick="recEd()">＋ Recette</button><button class="sec" onclick="depEd()">＋ Frais</button></div>`;
}
function tog(k){ S.done[k] = {v:!isDone(k), at:Date.now()}; touch(); }
function recRow(r){ return `<div class="it" onclick="recEd('${r.id}')"><div class="ic">${r.st === 'att' ? '⏳' : '💶'}</div><div class="t"><b>${esc(r.src || 'Recette')}${r.app ? ' · ' + esc(r.app) : ''}</b><small>${fd(r.date)}${r.mode ? ' · ' + esc(r.mode) : ''}${r.note ? ' · ' + esc(r.note) : ''}</small></div><div class="m" style="${r.st === 'att' ? 'color:var(--txt2)' : ''}">${eur(num(r.amt))}</div></div>`; }
function monthGroups(a, row){

function affV(){ const L = live(S.aff).sort((a, b)=>AST.findIndex(x=>x[0] === a.st) - AST.findIndex(x=>x[0] === b.st) || (a.name || '').localeCompare(b.name || ''));

    : `<div class="c"><div class="msg">Note ici chaque programme : où tu as postulé, son statut, ton identifiant, le seuil de paiement… Les recettes rattachées à un programme s’additionnent ici.<br><br>Idées pour Vezoria : Booking.com, GetYourGuide, Travelpayouts (vols, trains), Awin, Civitatis, Discover Cars.</div></div>`}`; }
function dlV(){
  const L = allDl(), open = L.filter(d=>!isDone(d.id)), done = L.filter(d=>isDone(d.id)), soon = open.filter(d=>daysTo(d.date) <= 400);

function importJ(inp){ const f = inp.files[0]; if(!f) return; f.text().then(t=>{ const j = JSON.parse(t); if(!j || !j.v) throw new Error('fichier inconnu'); S = merge(S, Object.assign(blank(), j)); touch(); toast('Importé et fusionné'); }).catch(e=>alert('Import impossible : ' + e.message)); inp.value = ''; }
function csv(){

    <div class="row"><button onclick="affSave('${id || ''}')">💾 Enregistrer</button>${id ? `<button class="dang" style="flex:0 0 auto" onclick="if(confirm('Supprimer ce programme ?')){drop('aff','${id}');close_();}">🗑</button>` : ''}<button class="sec" style="flex:0 0 auto" onclick="close_()">✕</button></div>
    ${id ? `<div class="row">${a.url ? `<button class="sec" onclick="window.open('${esc(a.url)}','_blank')">↗ Ouvrir</button>` : ''}<button class="sec" onclick="close_();recEd(null,{src:'${esc(a.name)}',app:'${esc((a.apps || '').split(',')[0].trim())}'})">＋ Recette de ce programme</button></div>` : ''}`); }
function affSave(id){ const name = $('a-name').value.trim(); if(!name){ alert('Donne un nom.'); return; }
  upsert('aff', {id:id || uid(), name, st:segV('a-st') || 'todo', plat:$('a-plat').value.trim(), apps:$('a-apps').value.trim(), taux:$('a-taux').value.trim(), seuil:$('a-seuil').value.trim(), aid:$('a-aid').value.trim(), url:$('a-url').value.trim(), note:$('a-note').value}); close_(); toast('Programme enregistré'); }
function dlEd(id){ const d = id ? S.dl.find(x=>x.id === id) : {date:addDays(today(), 7)};
  sheet(`<h3>${id ? 'Échéance' : 'Nouvelle échéance'}</h3>
    <label>Quoi ?</label><input id="e-title" value="${esc(d.title || '')}" placeholder="Ex. Renouveler le domaine vezoria.app">
    <label>Date</label><input id="e-date" type="date" value="${esc(d.date)}">
    <label>Note</label><input id="e-note" value="${esc(d.note || '')}">
    <div class="row"><button onclick="dlSave('${id || ''}')">💾 Enregistrer</button>${id ? `<button class="dang" style="flex:0 0 auto" onclick="if(confirm('Supprimer ?')){drop('dl','${id}');close_();}">🗑</button>` : ''}<button class="sec" style="flex:0 0 auto" onclick="close_()">✕</button></div>`); }
function dlSave(id){ const title = $('e-title').value.trim(); if(!title){ alert('Écris l’échéance.'); return; }
  upsert('dl', {id:id || uid(), title, date:$('e-date').value || today(), note:$('e-note').value.trim()}); close_(); toast('Échéance enregistrée'); }
let tT = 0; function toast(t){ let e = $('toast'); if(!e){ e = document.createElement('div'); e.id = 'toast'; e.style.cssText = 'position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#232a33;color:#E6EBF0;border:1px solid #262E38;border-radius:99px;padding:9px 16px;font:700 13px -apple-system,system-ui,sans-serif;z-index:60'; document.body.appendChild(e); } e.textContent = t; e.style.display = ''; clearTimeout(tT); tT = setTimeout(()=>{ e.style.display = 'none'; }, 1800); }

draw(); sync();
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') sync(); });
</script>
</body>
